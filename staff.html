<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>スタッフ管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFFBF3;
    --ink: #2B2320;
    --ink-soft: #7A6F63;
    --orange: #FF6F3C;
    --mint: #2FBF8F;
    --danger: #E0503A;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); font-family: "Zen Kaku Gothic New", sans-serif; height: 100%; }
  #shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  header { padding: 18px 20px 4px; text-align: center; flex-shrink: 0; }
  header .eyebrow { font-size: 12px; color: var(--mint); font-weight: 700; letter-spacing: 0.06em; }
  header h1 { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 20px; margin: 6px 0 0; }

  .login-box {
    margin: 40px 20px; background: var(--white); border-radius: 16px; padding: 24px 20px;
    box-shadow: 0 4px 14px rgba(43,35,32,0.08); text-align: center;
  }
  .login-box p { font-size: 13px; color: var(--ink-soft); margin: 0 0 4px; }
  .login-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #E6DFD3; font-size: 15px; margin: 14px 0; text-align: center; }
  .login-box button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--orange); color: var(--white); font-weight: 700; font-size: 15px; }
  .login-box button:disabled { background: var(--ink-soft); }
  .login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

  /* ---------- 選手用／一般用 切り替えヘッダー ---------- */
  .system-tabs {
    display: none; gap: 8px; padding: 10px 16px; flex-shrink: 0;
    background: var(--white); box-shadow: 0 2px 8px rgba(43,35,32,0.06); position: sticky; top: 0; z-index: 10;
  }
  .system-tabs.show { display: flex; }
  .system-tab-btn {
    flex: 1; border: none; background: var(--cream); color: var(--ink-soft); font-weight: 700;
    font-size: 14px; padding: 11px; border-radius: 10px; font-family: "Zen Maru Gothic", sans-serif;
  }
  .system-tab-btn.active { background: var(--orange); color: var(--white); }

  .iframe-wrap { flex: 1; display: none; position: relative; }
  .iframe-wrap.show { display: block; }
  .iframe-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

  .iframe-loading {
    position: absolute; inset: 0; background: var(--cream); display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--ink-soft); font-weight: 700; z-index: 5;
  }
  .iframe-loading .dino-img, .iframe-loading .tramp-mat,
  .iframe-loading .tramp-shadow, .iframe-loading .burst { animation-play-state: running; }

  /* ---------- アンケート管理パネル ---------- */
  .survey-panel { display: none; flex: 1; overflow-y: auto; padding: 14px 16px 40px; }
  .survey-panel.show { display: block; }
  .survey-section {
    background: var(--white); border-radius: 14px; padding: 16px; margin-bottom: 14px;
    box-shadow: 0 3px 10px rgba(43,35,32,0.06);
  }
  .survey-section-title { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 15px; margin-bottom: 10px; }
  .survey-field-label { display: block; font-size: 12px; color: var(--ink-soft); margin: 10px 0 4px; }
  .survey-panel input[type="text"], .survey-panel input[type="date"], .survey-panel textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #E6DFD3;
    font-size: 13.5px; box-sizing: border-box; font-family: inherit;
  }
  .survey-target-row { display: flex; gap: 14px; }
  .survey-checkbox { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .survey-checkbox input { width: auto; margin: 0; }

  .survey-question-card { background: var(--cream); border-radius: 10px; padding: 10px; margin-top: 10px; position: relative; }
  .survey-question-card .sq-remove {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
    border: none; background: var(--danger); color: var(--white); font-size: 11px;
  }
  .survey-question-card select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #E6DFD3; margin-bottom: 6px; font-size: 13px; }
  .survey-question-card input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #E6DFD3; margin-bottom: 6px; font-size: 13px; box-sizing: border-box; }
  .sq-options-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .sq-options-row input { flex: 1; margin-bottom: 0; }
  .sq-add-option-btn { border: none; background: var(--cream-deep, #EFE9DC); color: var(--ink-soft); font-size: 12px; padding: 6px 10px; border-radius: 8px; }
  .sq-number-hint { font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .sq-minmax-row { display: flex; gap: 10px; }
  .sq-minmax-col { flex: 1; }
  .sq-minmax-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .sq-minmax-col input { margin-bottom: 0; }
  .sq-minmax-row input { margin-bottom: 0; }

  .survey-add-question-btn {
    width: 100%; margin-top: 10px; border: 2px dashed #E6DFD3; background: transparent; color: var(--ink-soft);
    font-weight: 700; font-size: 13px; padding: 10px; border-radius: 10px;
  }
  .survey-draft-btn {
    width: 100%; margin-top: 16px; border: 2px solid var(--orange); background: var(--white); color: var(--orange);
    font-weight: 700; font-size: 13.5px; padding: 12px; border-radius: 12px; font-family: "Zen Maru Gothic", sans-serif;
  }
  .survey-create-btn {
    width: 100%; margin-top: 8px; border: none; background: var(--orange); color: var(--white);
    font-weight: 700; font-size: 14.5px; padding: 13px; border-radius: 12px; font-family: "Zen Maru Gothic", sans-serif;
  }
  .survey-create-btn:disabled { background: var(--ink-soft); }

  .survey-list-item {
    background: var(--cream); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .survey-list-item .sli-subject { font-weight: 700; font-size: 13.5px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .survey-list-item .sli-meta { font-size: 11.5px; color: var(--ink-soft); }
  .sli-draft-badge {
    display: inline-block; font-size: 10px; font-weight: 700; color: var(--orange);
    background: var(--orange-soft, #FFE3D6); padding: 1px 7px; border-radius: 999px;
  }
  .sli-copy-btn {
    margin-top: 8px; border: 1px solid var(--orange); background: var(--white); color: var(--orange);
    font-weight: 700; font-size: 11.5px; padding: 5px 10px; border-radius: 8px;
  }
  .survey-list-empty { font-size: 12.5px; color: var(--ink-soft); }

  .modal-overlay-survey {
    display: none; position: fixed; inset: 0; background: rgba(43,35,32,0.4); z-index: 80;
  }
  .modal-overlay-survey.show { display: block; }
  .survey-results-box {
    display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: calc(100% - 48px); max-width: 400px; max-height: 80vh; overflow-y: auto;
    background: var(--white); border-radius: 16px; padding: 20px; z-index: 81; box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  }
  .survey-results-box.show { display: block; }
  .survey-results-close {
    position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%;
    border: none; background: var(--cream); color: var(--ink-soft); font-size: 15px;
  }
  .sr-tally-row { margin-bottom: 14px; }
  .sr-tally-row .sr-q { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .sr-tally-opt { display: flex; justify-content: space-between; font-size: 12.5px; padding: 3px 0; color: var(--ink-soft); }
  .sr-response-item { border-top: 1px solid #F0EAE0; padding: 8px 0; font-size: 12px; }
  .sr-response-item .sr-name { font-weight: 700; color: var(--ink); }

  /* ---------- login loading overlay (dino) ---------- */
  .loading-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.75); z-index: 60; display: flex; align-items: center;
    justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .loading-overlay.show { opacity: 1; pointer-events: auto; }
  .loading-overlay.show .dino-img, .loading-overlay.show .tramp-mat,
  .loading-overlay.show .tramp-shadow, .loading-overlay.show .burst { animation-play-state: running; }

  .loading-mascot { display: flex; flex-direction: column; align-items: center; }
  .loading-text { margin-top: 2px; font-family: "Zen Maru Gothic", sans-serif; font-size: 13px; font-weight: 700; color: var(--ink); }
  .dino-scene { position: relative; width: 130px; height: 160px; }
  .tramp-shadow { position: absolute; left: 50%; bottom: 26px; width: 96px; height: 14px; margin-left: -48px; border-radius: 50%; background: rgba(43, 35, 32, 0.12); }
  .tramp-mat {
    position: absolute; left: 50%; bottom: 28px; width: 92px; height: 22px; margin-left: -46px;
    border-radius: 50%; background: #5C7FA6; border: 3px solid #3E5C7C; transform-origin: center;
    animation: matSquish 0.9s ease-in-out infinite; animation-play-state: paused; z-index: 2;
  }
  .tramp-leg { position: absolute; bottom: 6px; width: 4px; height: 26px; background: #B99E7A; border-radius: 2px; z-index: 1; }
  .tramp-leg-l1 { left: 50%; margin-left: -44px; transform: rotate(18deg); }
  .tramp-leg-l2 { left: 50%; margin-left: -24px; transform: rotate(8deg); }
  .tramp-leg-r1 { left: 50%; margin-left: 40px; transform: rotate(-18deg); }
  .tramp-leg-r2 { left: 50%; margin-left: 20px; transform: rotate(-8deg); }
  .dino-img {
    position: absolute; left: 50%; bottom: 34px; width: 64px; margin-left: -32px; transform-origin: 50% 100%;
    animation: dinoBounce 0.9s ease-in-out infinite; animation-play-state: paused; z-index: 3;
  }
  .burst {
    position: absolute; left: 50%; bottom: 40px; width: 5px; height: 32px; border-radius: 3px;
    background: #FFB648; opacity: 0; animation: burstFlash 0.9s ease-in-out infinite; animation-play-state: paused;
  }
  .burst-l { margin-left: -26px; transform: rotate(-24deg); }
  .burst-c { margin-left: -2.5px; background: #FFE07A; }
  .burst-r { margin-left: 20px; transform: rotate(24deg); }

  @keyframes dinoBounce {
    0%   { transform: translateY(0) scaleY(1); }
    35%  { transform: translateY(-42px) scaleY(1.03); }
    62%  { transform: translateY(0) scaleY(0.9); }
    76%  { transform: translateY(3px) scaleY(0.86); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @keyframes matSquish {
    0%   { transform: scaleX(1) scaleY(1); }
    58%  { transform: scaleX(1) scaleY(1); }
    70%  { transform: scaleX(1.12) scaleY(0.55); }
    84%  { transform: scaleX(1) scaleY(1); }
    100% { transform: scaleX(1) scaleY(1); }
  }
  @keyframes burstFlash {
    0%, 54% { opacity: 0; }
    66%     { opacity: 1; }
    84%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="shell">
  <div id="loginView" class="login-box">
    <p>選手用・一般用、共通のパスワードでログインします</p>
    <input type="password" id="passwordInput" placeholder="パスワード" />
    <button id="loginBtn">ログイン</button>
    <div class="login-error" id="loginError">パスワードが違います</div>
  </div>

  <div class="system-tabs" id="systemTabs">
    <button class="system-tab-btn active" data-system="athlete">選手用</button>
    <button class="system-tab-btn" data-system="general">一般用</button>
    <button class="system-tab-btn" data-system="survey">アンケート</button>
  </div>

  <div class="iframe-wrap" id="wrap-athlete">
    <div class="iframe-loading" id="loading-athlete" style="display:none;">
      <div class="loading-mascot">
        <div class="dino-scene">
          <div class="tramp-shadow"></div>
          <div class="burst burst-l"></div>
          <div class="burst burst-c"></div>
          <div class="burst burst-r"></div>
          <div class="tramp-leg tramp-leg-l1"></div>
          <div class="tramp-leg tramp-leg-l2"></div>
          <div class="tramp-leg tramp-leg-r1"></div>
          <div class="tramp-leg tramp-leg-r2"></div>
          <div class="tramp-mat"></div>
          <img src="dino.png" class="dino-img" alt="">
        </div>
        <div class="loading-text">じゅんびちゅう…</div>
      </div>
    </div>
    <iframe id="iframe-athlete" title="選手用スタッフ管理"></iframe>
  </div>
  <div class="iframe-wrap" id="wrap-general">
    <div class="iframe-loading" id="loading-general" style="display:none;">
      <div class="loading-mascot">
        <div class="dino-scene">
          <div class="tramp-shadow"></div>
          <div class="burst burst-l"></div>
          <div class="burst burst-c"></div>
          <div class="burst burst-r"></div>
          <div class="tramp-leg tramp-leg-l1"></div>
          <div class="tramp-leg tramp-leg-l2"></div>
          <div class="tramp-leg tramp-leg-r1"></div>
          <div class="tramp-leg tramp-leg-r2"></div>
          <div class="tramp-mat"></div>
          <img src="dino.png" class="dino-img" alt="">
        </div>
        <div class="loading-text">じゅんびちゅう…</div>
      </div>
    </div>
    <iframe id="iframe-general" title="一般用スタッフ管理"></iframe>
  </div>

  <div class="survey-panel" id="wrap-survey">
    <div class="survey-section">
      <div class="survey-section-title">新しいアンケートを作成</div>

      <label class="survey-field-label">配信先</label>
      <div class="survey-target-row">
        <label class="survey-checkbox"><input type="checkbox" id="targetAthlete" checked /> 選手用</label>
        <label class="survey-checkbox"><input type="checkbox" id="targetGeneral" checked /> 一般用</label>
      </div>

      <label class="survey-field-label">件名</label>
      <input type="text" id="surveySubjectInput" placeholder="例：施設についてのアンケート" />

      <label class="survey-field-label">内容（任意）</label>
      <textarea id="surveyContentInput" rows="3" placeholder="アンケートの説明があれば入力してください"></textarea>

      <label class="survey-field-label">公開日（空欄=作成後すぐ公開）</label>
      <input type="date" id="surveyPublishDateInput" />

      <label class="survey-field-label">締切日</label>
      <input type="date" id="surveyDeadlineInput" />

      <label class="survey-field-label">質問</label>
      <div id="surveyQuestionsBuilder"></div>
      <button class="survey-add-question-btn" id="addQuestionBtn">＋ 質問を追加</button>

      <button class="survey-draft-btn" id="draftSurveyBtn">一時保存する</button>
      <button class="survey-create-btn" id="createSurveyBtn">アンケートを作成する</button>
    </div>

    <div class="survey-section">
      <div class="survey-section-title">選手用のアンケート</div>
      <div id="athleteSurveyList" class="survey-list"></div>
    </div>

    <div class="survey-section">
      <div class="survey-section-title">一般用のアンケート</div>
      <div id="generalSurveyList" class="survey-list"></div>
    </div>
  </div>

  <div class="modal-overlay-survey" id="surveyResultsOverlay"></div>
  <div class="survey-results-box" id="surveyResultsBox">
    <button class="survey-results-close" id="surveyResultsCloseBtn">×</button>
    <div id="surveyResultsContent"></div>
  </div>

  <div class="loading-overlay" id="loginLoadingOverlay">
    <div class="loading-mascot">
      <div class="dino-scene">
        <div class="tramp-shadow"></div>
        <div class="burst burst-l"></div>
        <div class="burst burst-c"></div>
        <div class="burst burst-r"></div>
        <div class="tramp-leg tramp-leg-l1"></div>
        <div class="tramp-leg tramp-leg-l2"></div>
        <div class="tramp-leg tramp-leg-r1"></div>
        <div class="tramp-leg tramp-leg-r2"></div>
        <div class="tramp-mat"></div>
        <img src="dino.png" class="dino-img" alt="">
      </div>
      <div class="loading-text">確認中…</div>
    </div>
  </div>
</div>

<script>
/* ▼▼▼ ここだけ書き換えれば本番稼働します ▼▼▼ */
const ATHLETE_ENDPOINT = "https://script.google.com/macros/s/AKfycbwfdIXOL64z7DSMTvcXau6hFXMa5w6rYdwToZ8qg5BR9Aa9Is2w_Dp3X9eO3N7cBE1uXw/exec";
const GENERAL_ENDPOINT = "https://script.google.com/macros/s/AKfycbzwp_poHH7SLbSah842xfB0va4oLIDxfTuQ0aO6hbGYddvo7UHrV3aLVl8nlrjOhA33/exec";
// この2つのURLと同じ並びの.htmlファイルを、このstaff.htmlと同じGitHubリポジトリに置く
const ATHLETE_PAGE = "athlete_staff_inner.html";
const GENERAL_PAGE = "general/staff.html";
/* ▲▲▲ ここまで ▲▲▲ */

const loginView = document.getElementById("loginView");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const systemTabs = document.getElementById("systemTabs");

const wraps = { athlete: document.getElementById("wrap-athlete"), general: document.getElementById("wrap-general") };
const loadings = { athlete: document.getElementById("loading-athlete"), general: document.getElementById("loading-general") };
const iframes = { athlete: document.getElementById("iframe-athlete"), general: document.getElementById("iframe-general") };

async function checkPassword_(endpoint, pw){
  try {
    const res = await fetch(`${endpoint}?action=staffOverview&password=${encodeURIComponent(pw)}`);
    const data = await res.json();
    return !data.error;
  } catch (err){
    console.error("password check failed", err);
    return false;
  }
}

async function tryLogin(pw){
  loginBtn.disabled = true;
  loginBtn.textContent = "確認中…";
  loginError.style.display = "none";
  const loginLoadingOverlay = document.getElementById("loginLoadingOverlay");
  loginLoadingOverlay.classList.add("show");

  try {
    const [athleteOk, generalOk] = await Promise.all([
      checkPassword_(ATHLETE_ENDPOINT, pw),
      checkPassword_(GENERAL_ENDPOINT, pw),
    ]);

    if (!athleteOk && !generalOk){
      loginError.textContent = "パスワードが違います";
      loginError.style.display = "block";
      loginLoadingOverlay.classList.remove("show"); // ログイン失敗時はここで消す
      return;
    }
    if (!athleteOk || !generalOk){
      // 片方だけ通った場合は、選手用・一般用でパスワードがずれている可能性が高いので知らせる
      loginError.textContent = (athleteOk ? "一般用" : "選手用") + "側のパスワードが一致していないようです。両方のスクリプトプロパティのSTAFF_PASSWORDをご確認ください。";
      loginError.style.display = "block";
      // 通った方だけでも見られるようにはしておく
    }

    try { sessionStorage.setItem("unifiedStaffPassword", pw); } catch (e) {}
    loginView.style.display = "none";
    systemTabs.classList.add("show");
    wraps.athlete.classList.add("show"); // ログイン成功後に初めて選手用タブを表示する

    // ログイン成功と同時に、選手用・一般用どちらも裏で読み込みを始めておく
    // （一般用タブに切り替えた時に、また読み込み待ちが発生しないようにするため）
    // 恐竜は、今見えている選手用タブの読み込みが終わるまで消さない
    currentPassword = pw;
    loadIframe_("athlete");
    loadIframe_("general");

  } catch (err){
    console.error(err);
    loginError.textContent = "通信に失敗しました。時間をおいて再度お試しください";
    loginError.style.display = "block";
    loginLoadingOverlay.classList.remove("show"); // 通信失敗時もここで消す
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "ログイン";
  }
}

let currentPassword = "";
const loadedIframes = { athlete: false, general: false };
const PAGE_BY_SYSTEM = { athlete: ATHLETE_PAGE, general: GENERAL_PAGE };

const pageReady = { athlete: false, general: false };

function markPageReady_(system){
  if (pageReady[system]) return;
  pageReady[system] = true;
  loadings[system].style.display = "none";
  if (system === "athlete"){
    // ログイン直後に見えているのは選手用タブなので、恐竜はこちらの準備完了で消す
    document.getElementById("loginLoadingOverlay").classList.remove("show");
  }
}

// 中のページ（athlete_staff_inner.html / general/staff.html）が、実際に
// データ取得・描画まで終わった時に postMessage で知らせてくるので、それを待つ
window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "innerPageReady") return;
  if (!loadings[data.system]) return;
  markPageReady_(data.system);
});

function loadIframe_(system){
  if (loadedIframes[system] || !currentPassword) return;
  loadedIframes[system] = true;
  const cacheBust = Date.now(); // iframeの中身がキャッシュされたまま古くなるのを防ぐ
  iframes[system].src = `${PAGE_BY_SYSTEM[system]}?pw=${encodeURIComponent(currentPassword)}&cb=${cacheBust}`;
  // postMessageが何らかの理由で届かなかった時の保険として、
  // 少し長めに待ってからでも最終的には消えるようにしておく
  iframes[system].addEventListener("load", () => {
    setTimeout(() => {
      if (!pageReady[system]) markPageReady_(system);
    }, 8000);
  }, { once: true });
}

loginBtn.addEventListener("click", () => {
  const pw = passwordInput.value.trim();
  if (!pw) return;
  tryLogin(pw);
});

/* ---------- アンケート管理 ---------- */
const ENDPOINT_BY_SYSTEM = { athlete: ATHLETE_ENDPOINT, general: GENERAL_ENDPOINT };
const SYSTEM_LABEL = { athlete: "選手用", general: "一般用" };

function addQuestionCard_(prefill){
  const builder = document.getElementById("surveyQuestionsBuilder");
  const card = document.createElement("div");
  card.className = "survey-question-card";

  const removeBtn = document.createElement("button");
  removeBtn.className = "sq-remove";
  removeBtn.textContent = "×";
  removeBtn.addEventListener("click", () => card.remove());
  card.appendChild(removeBtn);

  const typeSelect = document.createElement("select");
  typeSelect.innerHTML = `<option value="radio">選択肢（ラジオボタン）</option><option value="number">数の選択</option>`;
  if (prefill && prefill.type) typeSelect.value = prefill.type;
  card.appendChild(typeSelect);

  const questionInput = document.createElement("input");
  questionInput.type = "text";
  questionInput.placeholder = "質問文を入力";
  if (prefill && prefill.question) questionInput.value = prefill.question;
  card.appendChild(questionInput);

  const radioFields = document.createElement("div");
  radioFields.className = "sq-radio-fields";
  const optionsWrap = document.createElement("div");
  radioFields.appendChild(optionsWrap);
  function addOptionRow_(value){
    const row = document.createElement("div");
    row.className = "sq-options-row";
    const optInput = document.createElement("input");
    optInput.type = "text";
    optInput.placeholder = "選択肢";
    if (value) optInput.value = value;
    row.appendChild(optInput);
    const rm = document.createElement("button");
    rm.className = "sq-add-option-btn";
    rm.textContent = "×";
    rm.addEventListener("click", () => row.remove());
    row.appendChild(rm);
    optionsWrap.appendChild(row);
  }
  if (prefill && prefill.type === "radio" && prefill.options && prefill.options.length){
    prefill.options.forEach(opt => addOptionRow_(opt));
  } else {
    addOptionRow_(); addOptionRow_();
  }
  const addOptBtn = document.createElement("button");
  addOptBtn.className = "sq-add-option-btn";
  addOptBtn.textContent = "＋ 選択肢を追加";
  addOptBtn.addEventListener("click", () => addOptionRow_());
  radioFields.appendChild(addOptBtn);
  card.appendChild(radioFields);

  const numberHint = document.createElement("div");
  numberHint.className = "sq-number-hint";
  numberHint.textContent = "お客さんが選べる数の範囲（最小〜最大）";
  card.appendChild(numberHint);

  const numberFields = document.createElement("div");
  numberFields.className = "sq-minmax-row";
  const minWrap = document.createElement("div");
  minWrap.className = "sq-minmax-col";
  const minLabel = document.createElement("div");
  minLabel.className = "sq-minmax-label";
  minLabel.textContent = "最小";
  const minInput = document.createElement("input");
  minInput.type = "number"; minInput.value = (prefill && prefill.min) || "1";
  minWrap.appendChild(minLabel);
  minWrap.appendChild(minInput);

  const maxWrap = document.createElement("div");
  maxWrap.className = "sq-minmax-col";
  const maxLabel = document.createElement("div");
  maxLabel.className = "sq-minmax-label";
  maxLabel.textContent = "最大";
  const maxInput = document.createElement("input");
  maxInput.type = "number"; maxInput.value = (prefill && prefill.max) || "5";
  maxWrap.appendChild(maxLabel);
  maxWrap.appendChild(maxInput);

  numberFields.appendChild(minWrap);
  numberFields.appendChild(maxWrap);
  card.appendChild(numberFields);

  const isNumber = prefill && prefill.type === "number";
  radioFields.style.display = isNumber ? "none" : "block";
  numberFields.style.display = isNumber ? "flex" : "none";
  numberHint.style.display = isNumber ? "block" : "none";

  typeSelect.addEventListener("change", () => {
    radioFields.style.display = typeSelect.value === "radio" ? "block" : "none";
    numberFields.style.display = typeSelect.value === "number" ? "flex" : "none";
    numberHint.style.display = typeSelect.value === "number" ? "block" : "none";
  });

  card._collect = () => {
    const question = questionInput.value.trim();
    if (!question) return null;
    if (typeSelect.value === "radio"){
      const options = Array.from(optionsWrap.querySelectorAll("input")).map(i => i.value.trim()).filter(Boolean);
      if (options.length < 2) return null;
      return { type: "radio", question: question, options: options };
    }
    return { type: "number", question: question, min: Number(minInput.value) || 1, max: Number(maxInput.value) || 5 };
  };

  builder.appendChild(card);
}
document.getElementById("addQuestionBtn").addEventListener("click", addQuestionCard_);
addQuestionCard_(); // 最初から1問分用意しておく

// 編集中のアンケートのID（システムごと。新規作成中は空文字）
// 一時保存を繰り返した時に、同じ下書きを上書きするために使う
let currentSurveyIds = { athlete: "", general: "" };

function resetSurveyForm_(){
  currentSurveyIds = { athlete: "", general: "" };
  document.getElementById("surveySubjectInput").value = "";
  document.getElementById("surveyContentInput").value = "";
  document.getElementById("surveyPublishDateInput").value = "";
  document.getElementById("surveyDeadlineInput").value = "";
  document.getElementById("targetAthlete").checked = true;
  document.getElementById("targetGeneral").checked = true;
  document.getElementById("surveyQuestionsBuilder").innerHTML = "";
  addQuestionCard_();
}

async function saveSurvey_(isDraft){
  const subject = document.getElementById("surveySubjectInput").value.trim();
  const content = document.getElementById("surveyContentInput").value.trim();
  const publishDate = document.getElementById("surveyPublishDateInput").value;
  const deadline = document.getElementById("surveyDeadlineInput").value;
  const targets = [];
  if (document.getElementById("targetAthlete").checked) targets.push("athlete");
  if (document.getElementById("targetGeneral").checked) targets.push("general");

  if (!subject){
    alert("件名は必須です");
    return;
  }
  if (targets.length === 0){
    alert("配信先を1つ以上選んでください");
    return;
  }
  const cards = Array.from(document.getElementById("surveyQuestionsBuilder").children);
  const questions = cards.map(c => c._collect()).filter(Boolean);

  if (!isDraft){
    if (!deadline){
      alert("締切日は必須です（一時保存なら空欄でも大丈夫です）");
      return;
    }
    if (questions.length === 0){
      alert("質問を1つ以上、正しく入力してください（選択肢は2つ以上）");
      return;
    }
  }

  const draftBtn = document.getElementById("draftSurveyBtn");
  const createBtn = document.getElementById("createSurveyBtn");
  const activeBtn = isDraft ? draftBtn : createBtn;
  draftBtn.disabled = true;
  createBtn.disabled = true;
  activeBtn.textContent = isDraft ? "一時保存中…" : "作成中…";

  const results = [];
  for (const sys of targets){
    try {
      const res = await fetch(ENDPOINT_BY_SYSTEM[sys], {
        method: "POST",
        body: JSON.stringify({
          action: "staffSaveSurvey", password: currentPassword,
          id: currentSurveyIds[sys] || undefined,
          subject, content, publishDate, deadline, questions, isDraft,
        }),
      });
      const data = await res.json();
      if (data.success) currentSurveyIds[sys] = data.id;
      results.push({ sys, ok: !!data.success });
    } catch (err){
      console.error(err);
      results.push({ sys, ok: false });
    }
  }

  draftBtn.disabled = false;
  createBtn.disabled = false;
  draftBtn.textContent = "一時保存する";
  createBtn.textContent = "アンケートを作成する";

  const failed = results.filter(r => !r.ok).map(r => SYSTEM_LABEL[r.sys]);
  if (failed.length){
    alert(failed.join("・") + "への保存に失敗しました（対応していない可能性があります）");
  } else if (isDraft){
    showToastSurvey_("一時保存しました");
  } else {
    alert("作成しました");
    resetSurveyForm_();
  }
  loadSurveyLists_();
}

document.getElementById("draftSurveyBtn").addEventListener("click", () => saveSurvey_(true));
document.getElementById("createSurveyBtn").addEventListener("click", () => saveSurvey_(false));

async function loadSurveyLists_(){
  const [athleteList, generalList] = await Promise.all([
    loadSurveyListForSystem_("athlete"), loadSurveyListForSystem_("general"),
  ]);

  // 下書きがあれば、まだ何も編集していない状態の時だけ、再開するか確認する
  const alreadyEditing = !!(currentSurveyIds.athlete || currentSurveyIds.general);
  if (alreadyEditing) return;

  const draftCandidates = [
    ...athleteList.filter(i => i.status === "draft").map(i => ({ sys: "athlete", item: i })),
    ...generalList.filter(i => i.status === "draft").map(i => ({ sys: "general", item: i })),
  ];
  if (draftCandidates.length === 0) return;

  // 一番新しく作られた下書きを優先して案内する
  draftCandidates.sort((a, b) => (b.item.createdDate || "").localeCompare(a.item.createdDate || ""));
  const top = draftCandidates[0];
  if (confirm(`下書き「${top.item.subject}」があります。再開しますか？`)){
    resumeSurveyDraft_(top.sys, top.item);
  }
}

// 下書きの内容を、新規作成フォームに読み込む
function resumeSurveyDraft_(sys, item){
  currentSurveyIds = { athlete: "", general: "" };
  currentSurveyIds[sys] = item.id;

  document.getElementById("surveySubjectInput").value = item.subject || "";
  document.getElementById("surveyContentInput").value = item.content || "";
  document.getElementById("surveyPublishDateInput").value = item.publishDate || "";
  document.getElementById("surveyDeadlineInput").value = item.deadline || "";
  document.getElementById("targetAthlete").checked = sys === "athlete";
  document.getElementById("targetGeneral").checked = sys === "general";

  const builder = document.getElementById("surveyQuestionsBuilder");
  builder.innerHTML = "";
  (item.questions || []).forEach(q => addQuestionCard_(q));
  if (!item.questions || !item.questions.length) addQuestionCard_();

  document.querySelector(".survey-panel").scrollTo({ top: 0, behavior: "smooth" });
  showToastSurvey_(`下書き「${item.subject}」を再開しました`);
}

// 過去のアンケートの内容を、新規作成フォームにコピーする
async function copySurveyToForm_(sys, surveyId){
  try {
    const res = await fetch(`${ENDPOINT_BY_SYSTEM[sys]}?action=staffSurveyResults&password=${encodeURIComponent(currentPassword)}&surveyId=${encodeURIComponent(surveyId)}`);
    const data = await res.json();
    if (!data.success){
      alert("コピー元の読み込みに失敗しました");
      return;
    }
    const survey = data.survey;

    currentSurveyIds = { athlete: "", general: "" }; // コピーは新規作成なので、編集中IDはリセットする
    document.getElementById("surveySubjectInput").value = survey.subject;
    document.getElementById("surveyContentInput").value = survey.content || "";
    document.getElementById("surveyPublishDateInput").value = "";
    document.getElementById("surveyDeadlineInput").value = ""; // 締切日は必ず選び直してもらう
    document.getElementById("targetAthlete").checked = sys === "athlete";
    document.getElementById("targetGeneral").checked = sys === "general";

    const builder = document.getElementById("surveyQuestionsBuilder");
    builder.innerHTML = "";
    (survey.questions || []).forEach(q => addQuestionCard_(q));
    if (!survey.questions || !survey.questions.length) addQuestionCard_();

    document.querySelector(".survey-panel").scrollTo({ top: 0, behavior: "smooth" });
    showToastSurvey_("内容をコピーしました。締切日を設定して作成してください");
  } catch (err){
    console.error(err);
    alert("通信に失敗しました");
  }
}

// staff.html独自の簡易トースト（既存のshowToastは無いので、ここで最小限用意する）
function showToastSurvey_(msg){
  let el = document.getElementById("surveyToast");
  if (!el){
    el = document.createElement("div");
    el.id = "surveyToast";
    el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:90;opacity:0;transition:opacity 0.25s ease;";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = "1";
  clearTimeout(showToastSurvey_._t);
  showToastSurvey_._t = setTimeout(() => { el.style.opacity = "0"; }, 2200);
}

async function loadSurveyListForSystem_(sys){
  const listEl = document.getElementById(sys === "athlete" ? "athleteSurveyList" : "generalSurveyList");
  listEl.innerHTML = `<div class="survey-list-empty">読み込み中…</div>`;
  try {
    const res = await fetch(`${ENDPOINT_BY_SYSTEM[sys]}?action=staffSurveyList&password=${encodeURIComponent(currentPassword)}`);
    const data = await res.json();
    const list = data.list || [];
    if (!list.length){
      listEl.innerHTML = `<div class="survey-list-empty">アンケートはまだありません</div>`;
      return list;
    }
    listEl.innerHTML = "";
    list.forEach(item => {
      const isDraft = item.status === "draft";
      const el = document.createElement("div");
      el.className = "survey-list-item";
      const badge = isDraft ? `<span class="sli-draft-badge">一時保存</span>` : "";
      const meta = isDraft
        ? `質問${item.questionCount}問${item.deadline ? " ／ 締切: " + item.deadline : ""}`
        : `締切: ${item.deadline} ／ 回答 ${item.responseCount}件 ／ ${item.active ? "配信中" : "停止中"}`;
      el.innerHTML = `<div class="sli-subject">${badge}<span>${item.subject}</span></div>
        <div class="sli-meta">${meta}</div>`;
      el.addEventListener("click", () => {
        if (isDraft) resumeSurveyDraft_(sys, item);
        else openSurveyResults_(sys, item.id);
      });

      const copyBtn = document.createElement("button");
      copyBtn.className = "sli-copy-btn";
      copyBtn.textContent = "コピーして作成";
      copyBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // 親のクリックを発火させない
        copySurveyToForm_(sys, item.id);
      });
      el.appendChild(copyBtn);

      listEl.appendChild(el);
    });
    return list;
  } catch (err){
    console.error(err);
    listEl.innerHTML = `<div class="survey-list-empty">読み込みに失敗しました（未対応の可能性があります）</div>`;
    return [];
  }
}

async function openSurveyResults_(sys, surveyId){
  const overlay = document.getElementById("surveyResultsOverlay");
  const box = document.getElementById("surveyResultsBox");
  const content = document.getElementById("surveyResultsContent");
  content.innerHTML = "読み込み中…";
  overlay.classList.add("show");
  box.classList.add("show");

  try {
    const res = await fetch(`${ENDPOINT_BY_SYSTEM[sys]}?action=staffSurveyResults&password=${encodeURIComponent(currentPassword)}&surveyId=${encodeURIComponent(surveyId)}`);
    const data = await res.json();
    if (!data.success){
      content.innerHTML = "結果を取得できませんでした";
      return;
    }
    let html = `<div class="survey-section-title">${data.survey.subject}</div>`;
    html += `<div class="sli-meta" style="margin-bottom:14px;">${SYSTEM_LABEL[sys]}／締切: ${data.survey.deadline}／回答 ${data.responses.length}件</div>`;

    data.tally.forEach(t => {
      html += `<div class="sr-tally-row"><div class="sr-q">${t.question}</div>`;
      if (t.type === "radio"){
        Object.keys(t.counts).forEach(opt => {
          html += `<div class="sr-tally-opt"><span>${opt}</span><span>${t.counts[opt]}件</span></div>`;
        });
      } else if (t.type === "number"){
        html += `<div class="sr-tally-opt"><span>平均</span><span>${t.average !== null ? t.average.toFixed(1) : "-"}（${t.count}件）</span></div>`;
      }
      html += `</div>`;
    });

    html += `<div class="survey-field-label">個別の回答</div>`;
    data.responses.forEach(r => {
      html += `<div class="sr-response-item"><span class="sr-name">${r.name}</span>（${r.respondedAt}）<br>`;
      html += r.answers.map(a => `${a.question}: ${a.answer}`).join(" / ");
      html += `</div>`;
    });

    content.innerHTML = html;
  } catch (err){
    console.error(err);
    content.innerHTML = "通信に失敗しました";
  }
}
