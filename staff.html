<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>スタッフ管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFFBF3;
    --ink: #2B2320;
    --ink-soft: #7A6F63;
    --orange: var(--calm-green);
    --orange-soft: var(--calm-green-soft);
    --mint: #2FBF8F;
    --booked: #4F8FE0;
    --danger: #E0503A;
    --calm-green: #6E8F6F;
    --calm-green-soft: rgba(110, 143, 111, 0.14);
    --danger-soft: #FDE4DE;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; }

  header { padding: 20px 20px 8px; text-align: center; }
  header .eyebrow { font-size: 12px; color: var(--mint); font-weight: 700; letter-spacing: 0.06em; }
  header h1 { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 22px; margin: 6px 0 0; }

  /* ---------- login ---------- */
  .login-box {
    margin: 40px 20px;
    background: var(--white);
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 4px 14px rgba(43,35,32,0.08);
    text-align: center;
  }
  .login-box input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #E6DFD3;
    font-size: 15px;
    margin: 14px 0;
    text-align: center;
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 15px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .login-box button:active { transform: scale(0.96); opacity: 0.9; }
  .login-box button:disabled { background: var(--ink-soft); }
  .login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

  /* ---------- today section ---------- */
  .section {
    padding: 16px 20px 20px;
    border-bottom: 8px solid var(--cream-deep, #FFF3E2);
  }
  .section:last-child { border-bottom: none; }
  .section .label {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
  }
  .today-card {
    background: var(--white);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(43,35,32,0.06);
  }
  .today-count {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .today-count b { color: var(--booked); font-size: 16px; }
  .name-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .name-chip {
    background: var(--calm-green-soft);
    color: var(--calm-green);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 700;
  }
  .empty-note { color: var(--ink-soft); font-size: 13px; }

  /* ---------- upcoming (cancellable) ---------- */
  .upcoming-card {
    background: var(--white);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 7px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
  }
  .upcoming-card .upcoming-date {
    font-weight: 700;
    font-size: 13.5px;
    margin-bottom: 6px;
  }
  .upcoming-card .upcoming-date.today { color: var(--booked); }
  .cancel-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--calm-green-soft);
    color: var(--calm-green);
    border-radius: 999px;
    padding: 5px 6px 5px 12px;
    font-size: 13px;
    font-weight: 700;
    margin: 0 6px 6px 0;
  }
  .cancel-chip button {
    border: none;
    background: rgba(110, 143, 111, 0.2);
    color: var(--calm-green);
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 900;
    line-height: 1;
  }

  /* ---------- billing ---------- */
  .refresh-btn {
    border: none;
    background: var(--white);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
    margin-bottom: 8px;
  }
  .refresh-btn:active { transform: scale(0.96); }

  .billing-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--white);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 7px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
  }
  .billing-row .billing-name {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 14px;
  }
  .card-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .card-badge.on { background: var(--mint); color: var(--white); }
  .card-badge.off { background: var(--gray-full, #D9D2C7); color: var(--ink-soft); }
  .billing-row input[type="number"] {
    flex: 1;
    min-width: 90px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #E6DFD3;
    font-size: 13.5px;
  }
  .billing-row .charge-btn {
    flex-shrink: 0;
    border: none;
    background: var(--orange);
    color: var(--white);
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 8px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .billing-row .charge-btn:active { transform: scale(0.94); opacity: 0.9; }
  .billing-row .charge-btn:disabled { background: var(--ink-soft); }

  /* ---------- date list ---------- */
  .date-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--white);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 7px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
  }
  .date-row .date-label {
    width: 100%;
    flex-shrink: 0;
    font-weight: 700;
    font-size: 13.5px;
  }
  .date-row .date-label.today { color: var(--booked); }

  .time-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-select {
    flex-shrink: 0;
    padding: 6px 4px;
    border-radius: 8px;
    border: 1px solid #E6DFD3;
    background: var(--orange-soft);
    color: var(--orange);
    font-weight: 700;
    font-size: 12px;
  }
  .closed-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    color: var(--danger);
    font-weight: 700;
    white-space: nowrap;
  }
  .closed-toggle input { width: 15px; height: 15px; }
  .time-wrap input[type="time"] {
    flex: 1;
    min-width: 90px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #E6DFD3;
    font-size: 13px;
  }
  .time-wrap input[type="time"]:disabled {
    background: var(--cream);
    color: var(--ink-soft);
  }
  .time-tilde { color: var(--ink-soft); font-size: 13px; }

  .date-row .save-btn {
    flex-shrink: 0;
    border: none;
    background: var(--mint);
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 10px;
    border-radius: 8px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .date-row .save-btn:active { transform: scale(0.94); opacity: 0.9; }
  .date-row .save-btn.saved { background: var(--ink-soft); }
  .saved-mark {
    font-size: 11.5px;
    color: var(--mint);
    font-weight: 700;
    white-space: nowrap;
    min-width: 44px;
  }
  .hint {
    color: var(--ink-soft);
    font-size: 12px;
    padding: 0 4px 10px;
  }

  .preset-editor-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .preset-editor-row .preset-label {
    width: 64px;
    flex-shrink: 0;
    font-weight: 900;
    font-size: 12.5px;
    color: var(--orange);
  }
  .preset-editor-row input[type="time"] {
    flex: 1;
    min-width: 0;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #E6DFD3;
    font-size: 13px;
  }
  .preset-quick-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mini-row-label {
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .preset-quick-btn {
    flex: 1;
    border: none;
    background: var(--orange-soft);
    color: var(--orange);
    font-weight: 700;
    font-size: 12.5px;
    padding: 8px 4px;
    border-radius: 8px;
  }
  .preset-quick-btn:active { transform: scale(0.96); }
  .preset-quick-btn.mini {
    flex: none;
    width: 30px;
    padding: 4px 0;
    font-size: 11px;
  }

  /* ---------- hours calendar ---------- */
  .calendar-toolbar {
    display: flex;
    gap: 8px;
    padding: 4px 0 8px;
  }
  .toolbar-btn {
    border: none;
    background: var(--white);
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 12.5px;
    padding: 9px 14px;
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
  }
  .toolbar-btn.active { background: var(--ink); color: var(--white); }
  .toolbar-btn.primary { background: var(--orange); color: var(--white); }
  .toolbar-btn:active { transform: scale(0.96); }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0 4px;
  }
  .month-nav .month-label {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 16px;
  }
  .month-nav button {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--white);
    box-shadow: 0 2px 8px rgba(43,35,32,0.08);
    font-size: 15px;
    color: var(--ink);
  }
  .month-nav button:disabled { opacity: 0.3; }

  .hours-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 700;
    padding: 4px 0;
  }
  .hours-weekdays .sun { color: var(--orange); }
  .hours-weekdays .sat { color: #4F8FE0; }

  .hours-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .hours-cell {
    aspect-ratio: 1/1;
    border: none;
    border-radius: 10px;
    background: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    box-shadow: 0 1px 4px rgba(43,35,32,0.05);
  }
  .hours-cell.empty { visibility: hidden; box-shadow: none; }
  .hours-cell .hc-num { font-size: 13px; font-weight: 700; color: var(--ink); }
  .hours-cell .hc-time { font-size: 7.5px; color: var(--ink-soft); font-weight: 700; line-height: 1.1; white-space: pre-line; text-align: center; }
  .hours-cell.is-closed { background: var(--danger-soft); }
  .hours-cell.is-closed .hc-time { color: var(--danger); }
  .hours-cell.is-selected { background: var(--orange); box-shadow: 0 2px 10px rgba(110, 143, 111, 0.35); }
  .hours-cell.is-selected .hc-num,
  .hours-cell.is-selected .hc-time { color: var(--white); }
  .hours-cell:active { transform: scale(0.94); }

  /* ---------- modal ---------- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,35,32,0.35);
    z-index: 60;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-card {
    width: calc(100% - 48px);
    max-width: 340px;
    background: var(--white);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  }
  .modal-title {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 14px;
    text-align: center;
  }
  .modal-card .time-wrap {
    justify-content: center;
    margin-bottom: 10px;
  }
  .modal-closed-toggle {
    display: flex;
    justify-content: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 16px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-cancel-btn, .modal-save-btn {
    flex: 1;
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
  }
  .modal-cancel-btn {
    background: var(--cream);
    color: var(--ink-soft);
  }
  .modal-save-btn {
    background: var(--orange);
    color: var(--white);
  }

  /* ---------- tabs ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    padding: 4px 20px 0;
    position: sticky;
    top: 0;
    background: var(--cream);
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: var(--white);
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 12.5px;
    padding: 10px 4px;
    border-radius: 10px 10px 0 0;
    box-shadow: 0 1px 4px rgba(43,35,32,0.05);
  }
  .tab-btn.active {
    background: var(--orange);
    color: var(--white);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .toast {
    position: fixed;
    left: 50%; transform: translateX(-50%) translateY(20px);
    bottom: 30px;
    background: var(--ink);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">TRAMPOLINE GYM BOOKING</div>
    <h1>スタッフ管理</h1>
  </header>

  <div id="loginView" class="login-box">
    <div>パスワードを入力してください</div>
    <input type="password" id="passwordInput" placeholder="パスワード" />
    <button id="loginBtn">ログイン</button>
    <div class="login-error" id="loginError">パスワードが違います</div>
  </div>

  <div id="mainView" style="display:none;">
    <div class="section">
      <div class="label">今週の予約者</div>
      <div id="weekList"></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="hours">営業時間</button>
      <button class="tab-btn" data-tab="bookings">予約状況(2ヶ月)</button>
      <button class="tab-btn" data-tab="billing">お月謝</button>
    </div>

    <div class="tab-panel active" id="tab-hours">
      <div class="section">
        <div class="label">営業パターン</div>
        <div class="hint">よく使うパターンを登録しておくと、カレンダーからワンタップで設定できます</div>
        <div id="presetEditors"></div>
        <button class="save-btn" id="presetSaveBtn">パターンを保存</button>
      </div>

      <div class="section">
        <div class="label">営業時間カレンダー</div>
        <div class="hint">日付をタップすると編集できます</div>

        <div class="calendar-toolbar">
          <button class="toolbar-btn" id="multiToggleBtn">複数選択する</button>
          <button class="toolbar-btn primary" id="multiEditBtn" style="display:none;">選択した日を編集(<span id="multiCount">0</span>)</button>
        </div>

        <div class="month-nav">
          <button id="hoursPrevMonth" aria-label="前の月">‹</button>
          <div class="month-label" id="hoursMonthLabel">2026年8月</div>
          <button id="hoursNextMonth" aria-label="次の月">›</button>
        </div>

        <div class="hours-weekdays">
          <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
        </div>

        <div class="hours-grid" id="hoursGrid"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-bookings">
      <div class="section">
        <div class="label">予約状況の確認・修正（タップでキャンセル）</div>
        <div id="upcomingList"></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-billing">
      <div class="section">
        <div class="label">今月の請求</div>
        <div class="hint">金額は500円単位で入力してください。「請求する」を押すと金額の確認画面が出ます。カード登録済みの生徒は自動引き落とし、未登録の生徒には支払いリンクが届きます。</div>
        <button class="refresh-btn" id="refreshCardBtn">カード登録状況を更新</button>
        <div id="billingList"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="hoursModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">8/20(木) の営業時間</div>

      <div class="preset-quick-row" id="modalPresetRow"></div>

      <div class="time-wrap">
        <input type="time" id="modalStart">
        <span class="time-tilde">〜</span>
        <input type="time" id="modalEnd">
      </div>
      <label class="closed-toggle modal-closed-toggle">
        <input type="checkbox" id="modalClosed">休館にする
      </label>

      <div class="modal-actions">
        <button class="modal-cancel-btn" id="modalCancelBtn">キャンセル</button>
        <button class="modal-save-btn" id="modalSaveBtn">保存する</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ▼▼▼ ここだけ書き換えれば本番稼働します ▼▼▼ */
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwfdIXOL64z7DSMTvcXau6hFXMa5w6rYdwToZ8qg5BR9Aa9Is2w_Dp3X9eO3N7cBE1uXw/exec";
/* ▲▲▲ ここまで ▲▲▲ */

const loginView = document.getElementById("loginView");
const mainView = document.getElementById("mainView");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const weekList = document.getElementById("weekList");
const dateList = document.getElementById("dateList");
const toastEl = document.getElementById("toast");
const upcomingList = document.getElementById("upcomingList");
const billingList = document.getElementById("billingList");
const refreshCardBtn = document.getElementById("refreshCardBtn");

let password = "";
let lastOverviewData = null;
let currentPresets = [];

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

async function fetchOverview(pw){
  const res = await fetch(`${GAS_ENDPOINT}?action=staffOverview&password=${encodeURIComponent(pw)}`);
  return await res.json();
}

function formatDateLabel(dateStr, todayStr){
  const [y,m,d] = dateStr.split("-");
  const dateObj = new Date(Number(y), Number(m)-1, Number(d));
  const w = ["日","月","火","水","木","金","土"][dateObj.getDay()];
  const label = `${Number(m)}/${Number(d)}(${w})`;
  return dateStr === todayStr ? label + " 本日" : label;
}

function renderPresetEditors(presets){
  const wrap = document.getElementById("presetEditors");
  wrap.innerHTML = "";
  presets.forEach((preset) => {
    const row = document.createElement("div");
    row.className = "preset-editor-row";
    row.dataset.label = preset.label;

    const label = document.createElement("div");
    label.className = "preset-label";
    label.textContent = preset.label + "パターン";
    row.appendChild(label);

    const isClosed = preset.hours === "休館";
    let startVal = "", endVal = "";
    if (!isClosed && preset.hours && preset.hours.indexOf("〜") !== -1){
      const parts = preset.hours.split("〜");
      startVal = parts[0].trim();
      endVal = (parts[1] || "").trim();
    }

    const closedLabel = document.createElement("label");
    closedLabel.className = "closed-toggle";
    const closedCheckbox = document.createElement("input");
    closedCheckbox.type = "checkbox";
    closedCheckbox.checked = isClosed;
    closedCheckbox.className = "preset-closed-checkbox";
    closedLabel.appendChild(closedCheckbox);
    closedLabel.appendChild(document.createTextNode("休館"));
    row.appendChild(closedLabel);

    const startInput = document.createElement("input");
    startInput.type = "time";
    startInput.value = startVal;
    startInput.disabled = isClosed;
    startInput.className = "preset-start-input";

    const endInput = document.createElement("input");
    endInput.type = "time";
    endInput.value = endVal;
    endInput.disabled = isClosed;
    endInput.className = "preset-end-input";

    closedCheckbox.addEventListener("change", () => {
      startInput.disabled = closedCheckbox.checked;
      endInput.disabled = closedCheckbox.checked;
    });

    row.appendChild(startInput);
    row.appendChild(document.createTextNode("〜"));
    row.appendChild(endInput);

    wrap.appendChild(row);
  });
}

document.getElementById("presetSaveBtn").addEventListener("click", async () => {
  const wrap = document.getElementById("presetEditors");
  const rows = wrap.querySelectorAll(".preset-editor-row");
  const presets = [];
  rows.forEach(row => {
    const label = row.dataset.label;
    const closed = row.querySelector(".preset-closed-checkbox").checked;
    const start = row.querySelector(".preset-start-input").value;
    const end = row.querySelector(".preset-end-input").value;
    const hours = closed ? "休館" : (start && end ? `${start}〜${end}` : "");
    presets.push({ label: label, hours: hours });
  });

  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({ action: "staffSavePresets", password: password, presets: presets }),
    });
    const result = await res.json();
    if (result.success){
      showToast("パターンを保存しました");
      currentPresets = presets;
      renderModalPresetButtons();
      if (currentDatesData.length) renderHoursCalendar();
    } else {
      showToast("保存に失敗しました");
    }
  } catch (err){
    console.error(err);
    showToast("通信に失敗しました");
  }
});

function renderWeek(upcoming, todayStr){
  weekList.innerHTML = "";
  const weekEnd = new Date(todayStr);
  weekEnd.setDate(weekEnd.getDate() + 6);

  const inWeek = upcoming.filter(item => {
    const d = new Date(item.date);
    return d >= new Date(todayStr) && d <= weekEnd;
  });

  if (!inWeek.length){
    weekList.innerHTML = `<div class="today-card"><span class="empty-note">今週の予約はまだありません</span></div>`;
    return;
  }

  inWeek.forEach(item => {
    const card = document.createElement("div");
    card.className = "today-card";

    const dateEl = document.createElement("div");
    dateEl.className = "today-count";
    dateEl.innerHTML = `<b>${formatDateLabel(item.date, todayStr)}</b>　${item.entries.length}人`;
    card.appendChild(dateEl);

    const row = document.createElement("div");
    row.className = "name-chip-row";
    item.entries.forEach(entry => {
      const chip = document.createElement("span");
      chip.className = "name-chip";
      chip.textContent = entry.name;
      row.appendChild(chip);
    });
    card.appendChild(row);

    weekList.appendChild(card);
  });
}

function renderUpcoming(upcoming, todayStr){
  upcomingList.innerHTML = "";
  if (!upcoming.length){
    upcomingList.innerHTML = `<span class="empty-note">今後2週間の予約はまだありません</span>`;
    return;
  }
  upcoming.forEach(item => {
    const card = document.createElement("div");
    card.className = "upcoming-card";

    const dateEl = document.createElement("div");
    dateEl.className = "upcoming-date" + (item.date === todayStr ? " today" : "");
    dateEl.textContent = formatDateLabel(item.date, todayStr);
    card.appendChild(dateEl);

    item.entries.forEach(entry => {
      const chip = document.createElement("span");
      chip.className = "cancel-chip";
      chip.innerHTML = `<span>${entry.name}</span>`;
      const x = document.createElement("button");
      x.textContent = "×";
      x.addEventListener("click", () => confirmStaffCancel(entry.userId, item.date, entry.name));
      chip.appendChild(x);
      card.appendChild(chip);
    });

    upcomingList.appendChild(card);
  });
}

function confirmStaffCancel(userId, dateStr, name){
  const label = formatDateLabel(dateStr, lastOverviewData ? lastOverviewData.today : "");
  const ok = window.confirm(`${name}さんの${label}の予約をキャンセルしますか？`);
  if (!ok) return;
  doStaffCancel(userId, dateStr);
}

async function doStaffCancel(userId, dateStr){
  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({ action: "staffCancel", password: password, userId: userId, date: dateStr }),
    });
    const result = await res.json();
    if (result.success){
      showToast("キャンセルしました");
      const data = await fetchOverview(password);
      if (!data.error) renderOverview(data);
    } else {
      showToast("キャンセルできませんでした");
    }
  } catch (err){
    console.error(err);
    showToast("通信に失敗しました");
  }
}

function renderOverview(data){
  lastOverviewData = data;
  currentPresets = data.presets || [];

  renderWeek(data.upcoming || [], data.today);
  renderUpcoming(data.upcoming || [], data.today);
  renderPresetEditors(currentPresets);
  renderModalPresetButtons();

  initHoursCalendarData(data.dates, data.today);
  renderHoursCalendar();
}

/* ---------- 営業時間カレンダー ---------- */
let currentDatesData = []; // [{date, hours}, ...]
let hoursToday = "";
let hoursViewYear = 0;
let hoursViewMonth = 0;
let hoursMinMonthIdx = 0;
let hoursMaxMonthIdx = 0;
let multiSelectMode = false;
let selectedHoursDates = new Set();

const hoursGridEl = document.getElementById("hoursGrid");
const hoursMonthLabelEl = document.getElementById("hoursMonthLabel");
const hoursPrevBtn = document.getElementById("hoursPrevMonth");
const hoursNextBtn = document.getElementById("hoursNextMonth");
const multiToggleBtn = document.getElementById("multiToggleBtn");
const multiEditBtn = document.getElementById("multiEditBtn");
const multiCountEl = document.getElementById("multiCount");

function formatHoursCompactStaff_(hours){
  if (!hours) return "未設定";
  if (hours === "休館") return "休館";
  const parts = hours.split("〜");
  if (parts.length !== 2) return hours;
  const strip = s => s.replace(":", "").trim();
  return `${strip(parts[0])}-\n${strip(parts[1])}`;
}

function initHoursCalendarData(dates, today){
  currentDatesData = dates;
  hoursToday = today;
  const [ty, tm] = today.split("-").map(Number);
  hoursViewYear = ty;
  hoursViewMonth = tm - 1;
  hoursMinMonthIdx = ty * 12 + (tm - 1);

  if (dates.length){
    const [ly, lm] = dates[dates.length - 1].date.split("-").map(Number);
    hoursMaxMonthIdx = ly * 12 + (lm - 1);
  } else {
    hoursMaxMonthIdx = hoursMinMonthIdx;
  }
}

function renderHoursCalendar(){
  const curIdx = hoursViewYear * 12 + hoursViewMonth;
  hoursPrevBtn.disabled = curIdx <= hoursMinMonthIdx;
  hoursNextBtn.disabled = curIdx >= hoursMaxMonthIdx;
  hoursMonthLabelEl.textContent = `${hoursViewYear}年${hoursViewMonth + 1}月`;

  const dataByDate = {};
  currentDatesData.forEach(d => { dataByDate[d.date] = d; });

  hoursGridEl.innerHTML = "";
  const firstDay = new Date(hoursViewYear, hoursViewMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(hoursViewYear, hoursViewMonth + 1, 0).getDate();

  for (let i = 0; i < startWeekday; i++){
    const empty = document.createElement("div");
    empty.className = "hours-cell empty";
    hoursGridEl.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++){
    const dateStr = `${hoursViewYear}-${String(hoursViewMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const info = dataByDate[dateStr];

    const cell = document.createElement("button");
    cell.className = "hours-cell";

    if (!info){
      cell.classList.add("empty");
    } else {
      if (info.hours === "休館") cell.classList.add("is-closed");
      if (selectedHoursDates.has(dateStr)) cell.classList.add("is-selected");

      const num = document.createElement("div");
      num.className = "hc-num";
      num.textContent = day;
      cell.appendChild(num);

      const timeEl = document.createElement("div");
      timeEl.className = "hc-time";
      timeEl.textContent = formatHoursCompactStaff_(info.hours);
      cell.appendChild(timeEl);

      cell.addEventListener("click", () => onHoursCellClick(dateStr));
    }

    hoursGridEl.appendChild(cell);
  }
}

function onHoursCellClick(dateStr){
  if (multiSelectMode){
    if (selectedHoursDates.has(dateStr)) selectedHoursDates.delete(dateStr);
    else selectedHoursDates.add(dateStr);
    updateMultiEditButton();
    renderHoursCalendar();
  } else {
    openHoursModal([dateStr]);
  }
}

function updateMultiEditButton(){
  multiCountEl.textContent = selectedHoursDates.size;
  multiEditBtn.style.display = selectedHoursDates.size > 0 ? "inline-block" : "none";
}

multiToggleBtn.addEventListener("click", () => {
  multiSelectMode = !multiSelectMode;
  multiToggleBtn.classList.toggle("active", multiSelectMode);
  multiToggleBtn.textContent = multiSelectMode ? "複数選択をやめる" : "複数選択する";
  if (!multiSelectMode){
    selectedHoursDates.clear();
    updateMultiEditButton();
  }
  renderHoursCalendar();
});

multiEditBtn.addEventListener("click", () => {
  if (!selectedHoursDates.size) return;
  openHoursModal(Array.from(selectedHoursDates));
});

hoursPrevBtn.addEventListener("click", () => {
  hoursViewMonth--;
  if (hoursViewMonth < 0){ hoursViewMonth = 11; hoursViewYear--; }
  renderHoursCalendar();
});
hoursNextBtn.addEventListener("click", () => {
  hoursViewMonth++;
  if (hoursViewMonth > 11){ hoursViewMonth = 0; hoursViewYear++; }
  renderHoursCalendar();
});

/* ---------- 営業時間の編集ポップアップ ---------- */
const hoursModalEl = document.getElementById("hoursModal");
const modalTitleEl = document.getElementById("modalTitle");
const modalStartEl = document.getElementById("modalStart");
const modalEndEl = document.getElementById("modalEnd");
const modalClosedEl = document.getElementById("modalClosed");
const modalSaveBtn = document.getElementById("modalSaveBtn");
const modalCancelBtn = document.getElementById("modalCancelBtn");
let modalTargetDates = [];

function renderModalPresetButtons(){
  const row = document.getElementById("modalPresetRow");
  row.innerHTML = "";
  (currentPresets || []).forEach(preset => {
    if (!preset.hours) return;
    const btn = document.createElement("button");
    btn.className = "preset-quick-btn";
    btn.textContent = preset.label;
    btn.addEventListener("click", () => {
      if (preset.hours === "休館"){
        modalClosedEl.checked = true;
        modalStartEl.disabled = true;
        modalEndEl.disabled = true;
      } else {
        const parts = preset.hours.split("〜");
        modalClosedEl.checked = false;
        modalStartEl.disabled = false;
        modalEndEl.disabled = false;
        modalStartEl.value = (parts[0] || "").trim();
        modalEndEl.value = (parts[1] || "").trim();
      }
    });
    row.appendChild(btn);
  });
}

modalClosedEl.addEventListener("change", () => {
  modalStartEl.disabled = modalClosedEl.checked;
  modalEndEl.disabled = modalClosedEl.checked;
});

function openHoursModal(dates){
  modalTargetDates = dates;
  const dataByDate = {};
  currentDatesData.forEach(d => { dataByDate[d.date] = d; });

  if (dates.length === 1){
    modalTitleEl.textContent = formatDateLabel(dates[0], hoursToday) + " の営業時間";
    const info = dataByDate[dates[0]];
    const hours = info ? info.hours : "";
    const isClosed = hours === "休館";
    modalClosedEl.checked = isClosed;
    if (!isClosed && hours && hours.indexOf("〜") !== -1){
      const parts = hours.split("〜");
      modalStartEl.value = (parts[0] || "").trim();
      modalEndEl.value = (parts[1] || "").trim();
    } else {
      modalStartEl.value = "";
      modalEndEl.value = "";
    }
    modalStartEl.disabled = isClosed;
    modalEndEl.disabled = isClosed;
  } else {
    modalTitleEl.textContent = dates.length + "件まとめて編集";
    modalClosedEl.checked = false;
    modalStartEl.value = "";
    modalEndEl.value = "";
    modalStartEl.disabled = false;
    modalEndEl.disabled = false;
  }

  hoursModalEl.classList.add("show");
}

function closeHoursModal(){
  hoursModalEl.classList.remove("show");
}

modalCancelBtn.addEventListener("click", closeHoursModal);

modalSaveBtn.addEventListener("click", async () => {
  const hoursValue = modalClosedEl.checked
    ? "休館"
    : (modalStartEl.value && modalEndEl.value ? `${modalStartEl.value}〜${modalEndEl.value}` : "");

  modalSaveBtn.disabled = true;
  modalSaveBtn.textContent = "保存中…";
  try {
    let result;
    if (modalTargetDates.length === 1){
      const res = await fetch(GAS_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          action: "staffUpdateHours",
          password: password,
          date: modalTargetDates[0],
          hours: hoursValue,
        }),
      });
      result = await res.json();
    } else {
      const res = await fetch(GAS_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          action: "staffUpdateHoursMulti",
          password: password,
          dates: modalTargetDates,
          hours: hoursValue,
        }),
      });
      result = await res.json();
    }

    if (result.success){
      showToast("保存しました");
      closeHoursModal();
      selectedHoursDates.clear();
      multiSelectMode = false;
      multiToggleBtn.classList.remove("active");
      multiToggleBtn.textContent = "複数選択する";
      updateMultiEditButton();
      const data = await fetchOverview(password);
      if (!data.error) renderOverview(data);
    } else {
      showToast("保存に失敗しました");
    }
  } catch (err){
    console.error(err);
    showToast("通信に失敗しました");
  } finally {
    modalSaveBtn.disabled = false;
    modalSaveBtn.textContent = "保存する";
  }
});

async function fetchBillingList(){
  try {
    const res = await fetch(`${GAS_ENDPOINT}?action=staffBillingList&password=${encodeURIComponent(password)}`);
    const data = await res.json();
    if (data.error) return;
    renderBilling(data.list || []);
  } catch (err){
    console.error(err);
    showToast("請求一覧の取得に失敗しました");
  }
}

function renderBilling(list){
  billingList.innerHTML = "";
  if (!list.length){
    billingList.innerHTML = `<span class="empty-note">対象の生徒がまだいません</span>`;
    return;
  }

  list.forEach(item => {
    const row = document.createElement("div");
    row.className = "billing-row";

    const nameRow = document.createElement("div");
    nameRow.className = "billing-name";
    nameRow.innerHTML = `<span>${item.name}</span>`;
    const badge = document.createElement("span");
    badge.className = "card-badge " + (item.cardOnFile ? "on" : "off");
    badge.textContent = item.cardOnFile ? "カード登録済み" : "未登録(初回リンク送信)";
    nameRow.appendChild(badge);
    row.appendChild(nameRow);

    const amountInput = document.createElement("input");
    amountInput.type = "number";
    amountInput.step = "500";
    amountInput.min = "0";
    amountInput.placeholder = "金額(500円単位)";
    amountInput.value = item.amount || "";
    row.appendChild(amountInput);

    const chargeBtn = document.createElement("button");
    chargeBtn.className = "charge-btn";
    chargeBtn.textContent = "請求する";
    chargeBtn.addEventListener("click", async () => {
      const rawAmount = Number(amountInput.value);
      if (!rawAmount || rawAmount <= 0){
        showToast("金額を入力してください");
        return;
      }
      // 500円単位に丸める（入力ミス防止）
      const amount = Math.round(rawAmount / 500) * 500;
      amountInput.value = amount;

      const ok = window.confirm(`${item.name}さんに\n\n${amount.toLocaleString()}円\n\nを請求します。この金額で間違いないですか？`);
      if (!ok) return;

      chargeBtn.disabled = true;
      chargeBtn.textContent = "処理中…";
      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify({
            action: "staffCharge",
            password: password,
            userId: item.userId,
            amount: amount,
          }),
        });
        const result = await res.json();
        if (result.success){
          if (result.status === "charged"){
            showToast(item.name + "さんへの引き落としが完了しました");
          } else if (result.status === "link_sent"){
            showToast(item.name + "さんへ支払いリンクを送信しました");
          } else {
            showToast(item.name + "さんへ請求しましたが、状態確認できませんでした");
          }
        } else {
          showToast("請求に失敗しました: " + (result.reason || ""));
        }
      } catch (err){
        console.error(err);
        showToast("通信に失敗しました");
      } finally {
        chargeBtn.disabled = false;
        chargeBtn.textContent = "請求する";
      }
    });
    row.appendChild(chargeBtn);

    billingList.appendChild(row);
  });
}



// タブ切り替え
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

refreshCardBtn.addEventListener("click", async () => {
  refreshCardBtn.disabled = true;
  refreshCardBtn.textContent = "更新中…";
  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({ action: "refreshCardStatus", password: password }),
    });
    const result = await res.json();
    if (result.success){
      showToast("カード登録状況を更新しました");
      await fetchBillingList();
    } else {
      showToast("更新に失敗しました");
    }
  } catch (err){
    console.error(err);
    showToast("通信に失敗しました");
  } finally {
    refreshCardBtn.disabled = false;
    refreshCardBtn.textContent = "カード登録状況を更新";
  }
});

async function tryLogin(pw){
  loginBtn.disabled = true;
  loginBtn.textContent = "確認中…";
  try {
    const data = await fetchOverview(pw);
    if (data.error){
      loginError.style.display = "block";
      return;
    }
    password = pw;
    try { sessionStorage.setItem("staffPassword", pw); } catch (e) {}
    loginView.style.display = "none";
    mainView.style.display = "block";
    renderOverview(data);
    fetchBillingList();
  } catch (err){
    console.error(err);
    loginError.textContent = "通信に失敗しました。時間をおいて再度お試しください";
    loginError.style.display = "block";
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "ログイン";
  }
}

loginBtn.addEventListener("click", () => {
  loginError.style.display = "none";
  const pw = passwordInput.value.trim();
  if (!pw) return;
  tryLogin(pw);
});
passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loginBtn.click();
});

// 前回ログイン済みならパスワード入力を省略
(function start(){
  let saved = "";
  try { saved = sessionStorage.getItem("staffPassword") || ""; } catch (e) {}
  if (saved) tryLogin(saved);
})();
