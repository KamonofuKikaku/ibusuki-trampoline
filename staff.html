<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>スタッフ管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFFBF3;
    --ink: #2B2320;
    --ink-soft: #7A6F63;
    --orange: #FF6F3C;
    --orange-soft: #FFE3D6;
    --mint: #2FBF8F;
    --booked: #4F8FE0;
    --danger: #E0503A;
    --danger-soft: #FDE4DE;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; }

  header { padding: 20px 20px 8px; text-align: center; }
  header .eyebrow { font-size: 12px; color: var(--mint); font-weight: 700; letter-spacing: 0.06em; }
  header h1 { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 22px; margin: 6px 0 0; }

  /* ---------- login ---------- */
  .login-box {
    margin: 40px 20px;
    background: var(--white);
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 4px 14px rgba(43,35,32,0.08);
    text-align: center;
  }
  .login-box input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #E6DFD3;
    font-size: 15px;
    margin: 14px 0;
    text-align: center;
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--orange);
    color: var(--white);
    font-weight: 700;
    font-size: 15px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .login-box button:active { transform: scale(0.96); opacity: 0.9; }
  .login-box button:disabled { background: var(--ink-soft); }
  .login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

  /* ---------- today section ---------- */
  .section { padding: 16px 20px 4px; }
  .section .label {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 10px;
  }
  .today-card {
    background: var(--white);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(43,35,32,0.06);
  }
  .today-count {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .today-count b { color: var(--booked); font-size: 16px; }
  .name-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .name-chip {
    background: var(--orange-soft);
    color: var(--orange);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 700;
  }
  .empty-note { color: var(--ink-soft); font-size: 13px; }

  /* ---------- upcoming (cancellable) ---------- */
  .upcoming-card {
    background: var(--white);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 7px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
  }
  .upcoming-card .upcoming-date {
    font-weight: 700;
    font-size: 13.5px;
    margin-bottom: 6px;
  }
  .upcoming-card .upcoming-date.today { color: var(--booked); }
  .cancel-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--orange-soft);
    color: var(--orange);
    border-radius: 999px;
    padding: 5px 6px 5px 12px;
    font-size: 13px;
    font-weight: 700;
    margin: 0 6px 6px 0;
  }
  .cancel-chip button {
    border: none;
    background: rgba(255,111,60,0.18);
    color: var(--orange);
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 900;
    line-height: 1;
  }

  /* ---------- billing ---------- */
  .refresh-btn {
    border: none;
    background: var(--white);
    color: var(--ink-soft);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
    margin-bottom: 8px;
  }
  .refresh-btn:active { transform: scale(0.96); }

  .billing-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--white);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 7px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
  }
  .billing-row .billing-name {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: 14px;
  }
  .card-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .card-badge.on { background: var(--mint); color: var(--white); }
  .card-badge.off { background: var(--gray-full, #D9D2C7); color: var(--ink-soft); }
  .billing-row input[type="number"] {
    flex: 1;
    min-width: 90px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #E6DFD3;
    font-size: 13.5px;
  }
  .billing-row .charge-btn {
    flex-shrink: 0;
    border: none;
    background: var(--orange);
    color: var(--white);
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 8px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .billing-row .charge-btn:active { transform: scale(0.94); opacity: 0.9; }
  .billing-row .charge-btn:disabled { background: var(--ink-soft); }

  /* ---------- date list ---------- */
  .date-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--white);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 7px;
    box-shadow: 0 1px 6px rgba(43,35,32,0.05);
  }
  .date-row .date-label {
    width: 100%;
    flex-shrink: 0;
    font-weight: 700;
    font-size: 13.5px;
  }
  .date-row .date-label.today { color: var(--booked); }

  .time-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .closed-toggle {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    color: var(--danger);
    font-weight: 700;
    white-space: nowrap;
  }
  .closed-toggle input { width: 15px; height: 15px; }
  .time-wrap input[type="time"] {
    flex: 1;
    min-width: 90px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid #E6DFD3;
    font-size: 13px;
  }
  .time-wrap input[type="time"]:disabled {
    background: var(--cream);
    color: var(--ink-soft);
  }
  .time-tilde { color: var(--ink-soft); font-size: 13px; }

  .date-row .save-btn {
    flex-shrink: 0;
    border: none;
    background: var(--mint);
    color: var(--white);
    font-size: 12px;
    font-weight: 700;
    padding: 8px 10px;
    border-radius: 8px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .date-row .save-btn:active { transform: scale(0.94); opacity: 0.9; }
  .date-row .save-btn.saved { background: var(--ink-soft); }
  .hint {
    color: var(--ink-soft);
    font-size: 12px;
    padding: 0 4px 10px;
  }

  .toast {
    position: fixed;
    left: 50%; transform: translateX(-50%) translateY(20px);
    bottom: 30px;
    background: var(--ink);
    color: var(--white);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">TRAMPOLINE GYM BOOKING</div>
    <h1>スタッフ管理</h1>
  </header>

  <div id="loginView" class="login-box">
    <div>パスワードを入力してください</div>
    <input type="password" id="passwordInput" placeholder="パスワード" />
    <button id="loginBtn">ログイン</button>
    <div class="login-error" id="loginError">パスワードが違います</div>
  </div>

  <div id="mainView" style="display:none;">
    <div class="section">
      <div class="label">今日の予約者</div>
      <div class="today-card">
        <div class="today-count"><b id="todayCount">0</b>人が予約中</div>
        <div class="name-chip-row" id="todayNames"></div>
      </div>
    </div>

    <div class="section">
      <div class="label">今後の予約一覧（今日から2週間・タップでキャンセル）</div>
      <div id="upcomingList"></div>
    </div>

    <div class="section">
      <div class="label">今月の請求</div>
      <div class="hint">金額を確認・入力してから「請求する」を押してください。カード登録済みの生徒は自動引き落とし、未登録の生徒には支払いリンクが届きます。</div>
      <button class="refresh-btn" id="refreshCardBtn">カード登録状況を更新</button>
      <div id="billingList"></div>
    </div>

    <div class="section">
      <div class="label">営業時間の編集（空欄にすると休館になります）</div>
      <div class="hint">例: 14:00〜22:00　のように入力して保存してください</div>
      <div id="dateList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ▼▼▼ ここだけ書き換えれば本番稼働します ▼▼▼ */
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwfdIXOL64z7DSMTvcXau6hFXMa5w6rYdwToZ8qg5BR9Aa9Is2w_Dp3X9eO3N7cBE1uXw/exec";
/* ▲▲▲ ここまで ▲▲▲ */

const loginView = document.getElementById("loginView");
const mainView = document.getElementById("mainView");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
const todayCount = document.getElementById("todayCount");
const todayNames = document.getElementById("todayNames");
const dateList = document.getElementById("dateList");
const toastEl = document.getElementById("toast");
const upcomingList = document.getElementById("upcomingList");
const billingList = document.getElementById("billingList");
const refreshCardBtn = document.getElementById("refreshCardBtn");

let password = "";
let lastOverviewData = null;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

async function fetchOverview(pw){
  const res = await fetch(`${GAS_ENDPOINT}?action=staffOverview&password=${encodeURIComponent(pw)}`);
  return await res.json();
}

function formatDateLabel(dateStr, todayStr){
  const [y,m,d] = dateStr.split("-");
  const dateObj = new Date(Number(y), Number(m)-1, Number(d));
  const w = ["日","月","火","水","木","金","土"][dateObj.getDay()];
  const label = `${Number(m)}/${Number(d)}(${w})`;
  return dateStr === todayStr ? label + " 本日" : label;
}

function renderUpcoming(upcoming, todayStr){
  upcomingList.innerHTML = "";
  if (!upcoming.length){
    upcomingList.innerHTML = `<span class="empty-note">今後2週間の予約はまだありません</span>`;
    return;
  }
  upcoming.forEach(item => {
    const card = document.createElement("div");
    card.className = "upcoming-card";

    const dateEl = document.createElement("div");
    dateEl.className = "upcoming-date" + (item.date === todayStr ? " today" : "");
    dateEl.textContent = formatDateLabel(item.date, todayStr);
    card.appendChild(dateEl);

    item.entries.forEach(entry => {
      const chip = document.createElement("span");
      chip.className = "cancel-chip";
      chip.innerHTML = `<span>${entry.name}</span>`;
      const x = document.createElement("button");
      x.textContent = "×";
      x.addEventListener("click", () => confirmStaffCancel(entry.userId, item.date, entry.name));
      chip.appendChild(x);
      card.appendChild(chip);
    });

    upcomingList.appendChild(card);
  });
}

function confirmStaffCancel(userId, dateStr, name){
  const label = formatDateLabel(dateStr, lastOverviewData ? lastOverviewData.today : "");
  const ok = window.confirm(`${name}さんの${label}の予約をキャンセルしますか？`);
  if (!ok) return;
  doStaffCancel(userId, dateStr);
}

async function doStaffCancel(userId, dateStr){
  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({ action: "staffCancel", password: password, userId: userId, date: dateStr }),
    });
    const result = await res.json();
    if (result.success){
      showToast("キャンセルしました");
      const data = await fetchOverview(password);
      if (!data.error) renderOverview(data);
    } else {
      showToast("キャンセルできませんでした");
    }
  } catch (err){
    console.error(err);
    showToast("通信に失敗しました");
  }
}

function renderOverview(data){
  lastOverviewData = data;
  todayCount.textContent = data.todayNames.length;
  todayNames.innerHTML = "";
  if (data.todayNames.length === 0){
    todayNames.innerHTML = `<span class="empty-note">今日の予約はまだありません</span>`;
  } else {
    data.todayNames.forEach(name => {
      const chip = document.createElement("span");
      chip.className = "name-chip";
      chip.textContent = name;
      todayNames.appendChild(chip);
    });
  }

  renderUpcoming(data.upcoming || [], data.today);

  dateList.innerHTML = "";
  data.dates.forEach(item => {
    const row = document.createElement("div");
    row.className = "date-row";

    const label = document.createElement("div");
    label.className = "date-label" + (item.date === data.today ? " today" : "");
    label.textContent = formatDateLabel(item.date, data.today);
    row.appendChild(label);

    // 既存の "14:00〜22:00" を開始・終了に分解。"休館"や空欄なら休館チェックを入れる
    const isClosed = !item.hours || item.hours === "休館";
    let startVal = "", endVal = "";
    if (!isClosed && item.hours.indexOf("〜") !== -1) {
      const parts = item.hours.split("〜");
      startVal = parts[0].trim();
      endVal = (parts[1] || "").trim();
    }

    const timeWrap = document.createElement("div");
    timeWrap.className = "time-wrap";

    const closedLabel = document.createElement("label");
    closedLabel.className = "closed-toggle";
    const closedCheckbox = document.createElement("input");
    closedCheckbox.type = "checkbox";
    closedCheckbox.checked = isClosed;
    closedLabel.appendChild(closedCheckbox);
    closedLabel.appendChild(document.createTextNode("休館"));
    timeWrap.appendChild(closedLabel);

    const startInput = document.createElement("input");
    startInput.type = "time";
    startInput.value = startVal;
    startInput.disabled = isClosed;

    const tilde = document.createElement("span");
    tilde.className = "time-tilde";
    tilde.textContent = "〜";

    const endInput = document.createElement("input");
    endInput.type = "time";
    endInput.value = endVal;
    endInput.disabled = isClosed;

    closedCheckbox.addEventListener("change", () => {
      startInput.disabled = closedCheckbox.checked;
      endInput.disabled = closedCheckbox.checked;
    });

    timeWrap.appendChild(startInput);
    timeWrap.appendChild(tilde);
    timeWrap.appendChild(endInput);
    row.appendChild(timeWrap);

    const btn = document.createElement("button");
    btn.className = "save-btn";
    btn.textContent = "保存";
    btn.addEventListener("click", async () => {
      const hoursValue = closedCheckbox.checked
        ? "休館"
        : (startInput.value && endInput.value ? `${startInput.value}〜${endInput.value}` : "");
      btn.textContent = "保存中";
      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify({
            action: "staffUpdateHours",
            password: password,
            date: item.date,
            hours: hoursValue,
          }),
        });
        const result = await res.json();
        if (result.success){
          btn.textContent = "保存済み";
          btn.classList.add("saved");
          showToast(formatDateLabel(item.date, data.today) + " を保存しました");
          setTimeout(() => { btn.textContent = "保存"; btn.classList.remove("saved"); }, 1500);
        } else {
          btn.textContent = "保存";
          showToast("保存に失敗しました");
        }
      } catch (err){
        console.error(err);
        btn.textContent = "保存";
        showToast("通信に失敗しました");
      }
    });
    row.appendChild(btn);

    dateList.appendChild(row);
  });
}

async function fetchBillingList(){
  try {
    const res = await fetch(`${GAS_ENDPOINT}?action=staffBillingList&password=${encodeURIComponent(password)}`);
    const data = await res.json();
    if (data.error) return;
    renderBilling(data.list || []);
  } catch (err){
    console.error(err);
    showToast("請求一覧の取得に失敗しました");
  }
}

function renderBilling(list){
  billingList.innerHTML = "";
  if (!list.length){
    billingList.innerHTML = `<span class="empty-note">対象の生徒がまだいません</span>`;
    return;
  }

  list.forEach(item => {
    const row = document.createElement("div");
    row.className = "billing-row";

    const nameRow = document.createElement("div");
    nameRow.className = "billing-name";
    nameRow.innerHTML = `<span>${item.name}</span>`;
    const badge = document.createElement("span");
    badge.className = "card-badge " + (item.cardOnFile ? "on" : "off");
    badge.textContent = item.cardOnFile ? "カード登録済み" : "未登録(初回リンク送信)";
    nameRow.appendChild(badge);
    row.appendChild(nameRow);

    const amountInput = document.createElement("input");
    amountInput.type = "number";
    amountInput.placeholder = "金額(円)";
    amountInput.value = item.amount || "";
    row.appendChild(amountInput);

    const chargeBtn = document.createElement("button");
    chargeBtn.className = "charge-btn";
    chargeBtn.textContent = "請求する";
    chargeBtn.addEventListener("click", async () => {
      const amount = Number(amountInput.value);
      if (!amount || amount <= 0){
        showToast("金額を入力してください");
        return;
      }
      const ok = window.confirm(`${item.name}さんに ${amount}円 を請求します。よろしいですか？`);
      if (!ok) return;

      chargeBtn.disabled = true;
      chargeBtn.textContent = "処理中…";
      try {
        const res = await fetch(GAS_ENDPOINT, {
          method: "POST",
          body: JSON.stringify({
            action: "staffCharge",
            password: password,
            userId: item.userId,
            amount: amount,
          }),
        });
        const result = await res.json();
        if (result.success){
          if (result.status === "charged"){
            showToast(item.name + "さんへの引き落としが完了しました");
          } else if (result.status === "link_sent"){
            showToast(item.name + "さんへ支払いリンクを送信しました");
          } else {
            showToast(item.name + "さんへ請求しましたが、状態確認できませんでした");
          }
        } else {
          showToast("請求に失敗しました: " + (result.reason || ""));
        }
      } catch (err){
        console.error(err);
        showToast("通信に失敗しました");
      } finally {
        chargeBtn.disabled = false;
        chargeBtn.textContent = "請求する";
      }
    });
    row.appendChild(chargeBtn);

    billingList.appendChild(row);
  });
}

refreshCardBtn.addEventListener("click", async () => {
  refreshCardBtn.disabled = true;
  refreshCardBtn.textContent = "更新中…";
  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({ action: "refreshCardStatus", password: password }),
    });
    const result = await res.json();
    if (result.success){
      showToast("カード登録状況を更新しました");
      await fetchBillingList();
    } else {
      showToast("更新に失敗しました");
    }
  } catch (err){
    console.error(err);
    showToast("通信に失敗しました");
  } finally {
    refreshCardBtn.disabled = false;
    refreshCardBtn.textContent = "カード登録状況を更新";
  }
});

async function tryLogin(pw){
  loginBtn.disabled = true;
  loginBtn.textContent = "確認中…";
  try {
    const data = await fetchOverview(pw);
    if (data.error){
      loginError.style.display = "block";
      return;
    }
    password = pw;
    try { sessionStorage.setItem("staffPassword", pw); } catch (e) {}
    loginView.style.display = "none";
    mainView.style.display = "block";
    renderOverview(data);
    fetchBillingList();
  } catch (err){
    console.error(err);
    loginError.textContent = "通信に失敗しました。時間をおいて再度お試しください";
    loginError.style.display = "block";
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "ログイン";
  }
}

loginBtn.addEventListener("click", () => {
  loginError.style.display = "none";
  const pw = passwordInput.value.trim();
  if (!pw) return;
  tryLogin(pw);
});
passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") loginBtn.click();
});

// 前回ログイン済みならパスワード入力を省略
(function start(){
  let saved = "";
  try { saved = sessionStorage.getItem("staffPassword") || ""; } catch (e) {}
  if (saved) tryLogin(saved);
})();
</script>
</body>
</html>
