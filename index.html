<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>予約カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://static.line-scdn.net">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --cream: #FFFBF3;
    --cream-deep: #FFF3E2;
    --ink: #2B2320;
    --ink-soft: #7A6F63;
    --orange: #FF6F3C;
    --orange-soft: #FFE3D6;
    --mint: #2FBF8F;
    --mint-soft: #DFF6EC;
    --booked: #4F8FE0;
    --booked-soft: #E4EFFC;
    --danger: #E0503A;
    --gray-full: #D9D2C7;
    --gray-full-text: #A79E92;
    --white: #FFFFFF;
    --shadow: 0 6px 20px rgba(255, 111, 60, 0.14);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", sans-serif;
    overscroll-behavior-y: none;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 96px;
    position: relative;
  }

  /* ---------- header ---------- */
  header {
    padding: 20px 20px 12px;
    text-align: center;
  }
  header .eyebrow {
    font-size: 13px;
    color: var(--mint);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  header h1 {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 26px;
    margin: 6px 0 0;
  }
  header p.sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 6px 0 0;
  }

  /* ---------- calendar section (スタッフ側と統一したカード・枠線デザイン) ---------- */
  .calendar-section {
    margin: 10px 16px 4px;
    padding: 16px 16px 14px;
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 3px 14px rgba(43,35,32,0.07);
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px 4px;
  }
  .month-nav .month-label {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 19px;
  }
  .month-nav button {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: var(--cream);
    font-size: 17px;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .month-nav button:disabled {
    opacity: 0.3;
  }
  .month-nav button:active { transform: scale(0.92); }

  /* ---------- legend ---------- */
  .legend {
    display: flex;
    gap: 12px;
    padding: 8px 2px 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    flex-wrap: wrap;
  }
  .legend .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .legend .dot.ok { background: var(--mint); }
  .legend .dot.low { background: var(--orange); }
  .legend .dot.full { background: var(--gray-full-text); }
  .legend .dot.closed { background: var(--danger); }
  .legend .dot.mint { background: var(--booked); }

  /* ---------- calendar grid ---------- */
  .calendar-card {
    background: var(--cream);
    border-radius: 16px;
    padding: 10px 8px 10px;
    border: 1px solid rgba(43,35,32,0.06);
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    padding: 2px 4px 8px;
    text-align: center;
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 700;
    border-bottom: 1px solid rgba(43,35,32,0.08);
    margin-bottom: 6px;
  }
  .weekdays .sun { color: var(--orange); }
  .weekdays .sat { color: #4F8FE0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    padding: 0 2px;
  }

  .day-cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 0;
    padding: 2px 0 4px;
    background: var(--white);
    border: 1px solid rgba(43,35,32,0.08);
    border-radius: 10px;
  }
  .day-cell.empty { visibility: hidden; border: none; background: transparent; }

  .day-btn {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Zen Kaku Gothic New", sans-serif;
    cursor: pointer;
  }

  .day-num {
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
    z-index: 2;
  }

  /* スタッフ側と同じく、背景なしのシンプルな文字表示 */
  .day-hours {
    margin-top: 1px;
    font-size: 9px;
    font-weight: 700;
    color: var(--ink-soft);
    line-height: 1.15;
    text-align: center;
    white-space: pre-line;
  }
  .day-cell.is-past .day-hours { visibility: hidden; }
  .day-cell.is-closed .day-hours { color: var(--danger); font-weight: 900; }

  /* stamp = signature element for selected day */
  .stamp {
    position: absolute;
    width: 78%;
    height: 78%;
    z-index: 1;
    opacity: 0;
    transform: scale(0.4) rotate(-8deg);
    transition: opacity 0.22s ease, transform 0.28s cubic-bezier(.34,1.56,.64,1);
  }
  .day-btn.selected .stamp path { fill: var(--mint); }
  .day-btn.selected .stamp {
    opacity: 1;
    transform: scale(1) rotate(-6deg);
  }
  .day-btn.selected .day-num { color: var(--white); font-weight: 700; }

  .day-btn.past { pointer-events: none; }
  .day-btn.past .day-num { color: #D8D2C7; }

  .day-btn.full { pointer-events: none; }
  .day-btn.full .day-num { color: var(--gray-full-text); }

  .day-btn.closed { pointer-events: none; }
  .day-btn.closed .day-num { color: var(--gray-full-text); }
  .day-btn.closed .avail-ring { background: var(--gray-full); opacity: 0.5; }

  /* 予約済み(あなたの予約) = 青いスタンプ、タップでキャンセル */
  .day-btn.booked .stamp path { fill: var(--booked); }
  .day-btn.booked .stamp {
    opacity: 1;
    transform: scale(1) rotate(-6deg);
  }
  .day-btn.booked .day-num { color: var(--white); font-weight: 700; }
  .day-btn.booked { cursor: pointer; }
  .day-btn.booked:active { transform: scale(0.94); }

  .avail-ring {
    position: absolute;
    width: 74%; height: 74%;
    border-radius: 50%;
    z-index: 1;
  }
  .day-btn.full .avail-ring { background: var(--gray-full); opacity: 0.5; }

  .day-btn:active:not(.full):not(.past) { transform: scale(0.94); }

  /* ---------- business hours ---------- */
  .business-hours {
    margin: 4px 20px 0;
    padding: 10px 16px;
    border-radius: 12px;
    background: var(--white);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 2px 8px rgba(43,35,32,0.06);
  }
  .business-hours .value {
    color: var(--orange);
    font-family: "Zen Maru Gothic", sans-serif;
  }

  /* ---------- selected chips ---------- */
  .selection-panel {
    padding: 6px 20px 0;
  }
  .selection-panel .label {
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .chip-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--mint-soft);
    color: var(--mint);
    border-radius: 999px;
    padding: 8px 12px 8px 14px;
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .chip button {
    border: none;
    background: rgba(47,191,143,0.18);
    color: var(--mint);
    width: 19px; height: 19px;
    border-radius: 50%;
    font-size: 11px;
    line-height: 1;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- sticky CTA ---------- */
  .cta-bar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 480px;
    background: var(--white);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(43,35,32,0.08);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .cta-count {
    font-size: 13.5px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .cta-count b { color: var(--ink); font-size: 17px; }
  .cta-btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--white);
    background: linear-gradient(135deg, var(--mint), #45D6A0);
    box-shadow: 0 6px 20px rgba(47, 191, 143, 0.14);
  }
  .cta-btn:disabled {
    background: var(--gray-full);
    box-shadow: none;
    color: var(--gray-full-text);
  }
  .cta-btn:active:not(:disabled) { transform: scale(0.98); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 50%; transform: translateX(-50%) translateY(20px);
    bottom: 100px;
    background: var(--ink);
    color: var(--white);
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- アンケート ---------- */
  .survey-banner {
    position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; background: var(--mint); color: var(--white); padding: 10px 16px;
    font-size: 12.5px; font-weight: 700; transition: transform 0.25s ease;
  }
  .survey-banner.hide-on-scroll { transform: translateY(-100%); }
  .survey-banner button {
    flex-shrink: 0; border: none; background: var(--white); color: var(--mint); font-weight: 700;
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
  }
  .survey-question { margin-bottom: 16px; text-align: left; }
  .survey-question .sq-title { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; }
  .survey-options { display: flex; flex-direction: column; gap: 6px; }
  .survey-options.numbers { flex-direction: row; flex-wrap: wrap; }
  .survey-option-label {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid #E6DFD3; font-size: 13px; cursor: pointer;
  }
  .survey-options.numbers .survey-option-label { flex: 1; min-width: 44px; justify-content: center; padding: 9px 4px; }
  .survey-option-label input { width: auto; margin: 0; }
  .survey-option-label.checked { border-color: var(--mint); background: var(--mint-soft); color: var(--mint); font-weight: 700; }

  /* ---------- register (初回のお名前登録) ---------- */
  .register-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,35,32,0.4);
    z-index: 70;
    align-items: center;
    justify-content: center;
  }
  .register-overlay.show { display: flex; }
  .register-card {
    width: calc(100% - 48px);
    max-width: 340px;
    background: var(--white);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    text-align: center;
  }
  .register-title {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 900;
    font-size: 17px;
    margin-bottom: 8px;
  }
  .register-hint {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .register-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #E6DFD3;
    font-size: 15px;
    margin-bottom: 14px;
    text-align: center;
  }
  .register-btn {
    width: 100%;
    border: none;
    padding: 13px;
    border-radius: 12px;
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--white);
    background: linear-gradient(135deg, var(--mint), #45D6A0);
  }
  .register-btn:disabled { opacity: 0.6; }

  .edit-name-link {
    display: block;
    margin: 10px auto 4px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 11.5px;
    text-decoration: underline;
    padding: 4px;
  }

  .registered-name {
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    margin-top: 6px;
  }

  /* ---------- loading overlay (恐竜がトランポリンで跳ねる) ---------- */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.6);
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .loading-overlay.show { opacity: 1; }
  .loading-overlay.show .dino-img,
  .loading-overlay.show .tramp-mat,
  .loading-overlay.show .tramp-shadow,
  .loading-overlay.show .burst {
    animation-play-state: running;
  }

  .loading-mascot {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .loading-text {
    margin-top: 2px;
    font-family: "Zen Maru Gothic", sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }

  .dino-scene {
    position: relative;
    width: 130px;
    height: 160px;
  }

  .tramp-shadow {
    position: absolute;
    left: 50%;
    bottom: 26px;
    width: 96px;
    height: 14px;
    margin-left: -48px;
    border-radius: 50%;
    background: rgba(43, 35, 32, 0.12);
  }

  .tramp-mat {
    position: absolute;
    left: 50%;
    bottom: 28px;
    width: 92px;
    height: 22px;
    margin-left: -46px;
    border-radius: 50%;
    background: #5C7FA6;
    border: 3px solid #3E5C7C;
    transform-origin: center;
    animation: matSquish 0.9s ease-in-out infinite;
    animation-play-state: paused;
    z-index: 2;
  }

  .tramp-leg {
    position: absolute;
    bottom: 6px;
    width: 4px;
    height: 26px;
    background: #B99E7A;
    border-radius: 2px;
    z-index: 1;
  }
  .tramp-leg-l1 { left: 50%; margin-left: -44px; transform: rotate(18deg); }
  .tramp-leg-l2 { left: 50%; margin-left: -24px; transform: rotate(8deg); }
  .tramp-leg-r1 { left: 50%; margin-left: 40px; transform: rotate(-18deg); }
  .tramp-leg-r2 { left: 50%; margin-left: 20px; transform: rotate(-8deg); }

  .dino-img {
    position: absolute;
    left: 50%;
    bottom: 34px;
    width: 64px;
    margin-left: -32px;
    transform-origin: 50% 100%;
    animation: dinoBounce 0.9s ease-in-out infinite;
    animation-play-state: paused;
    z-index: 3;
  }

  .burst {
    position: absolute;
    left: 50%;
    bottom: 40px;
    width: 5px;
    height: 32px;
    border-radius: 3px;
    background: #FFB648;
    opacity: 0;
    animation: burstFlash 0.9s ease-in-out infinite;
    animation-play-state: paused;
    z-index: 3;
  }
  .burst-l { margin-left: -26px; transform: rotate(-24deg); }
  .burst-c { margin-left: -2.5px; background: #FFE07A; }
  .burst-r { margin-left: 20px; transform: rotate(24deg); }

  @keyframes dinoBounce {
    0%   { transform: translateY(0) scaleY(1); }
    35%  { transform: translateY(-42px) scaleY(1.03); }
    62%  { transform: translateY(0) scaleY(0.9); }
    76%  { transform: translateY(3px) scaleY(0.86); }
    100% { transform: translateY(0) scaleY(1); }
  }
  @keyframes matSquish {
    0%   { transform: scaleX(1) scaleY(1); }
    58%  { transform: scaleX(1) scaleY(1); }
    70%  { transform: scaleX(1.12) scaleY(0.55); }
    84%  { transform: scaleX(1) scaleY(1); }
    100% { transform: scaleX(1) scaleY(1); }
  }
  @keyframes burstFlash {
    0%, 54% { opacity: 0; }
    66%     { opacity: 1; }
    84%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="survey-banner" id="surveyBanner" style="display:none;">
    <span id="surveyBannerText">アンケートの回答はこちら</span>
    <button id="surveyBannerBtn">回答する</button>
  </div>

  <header>
    <div class="eyebrow">TRAMPOLINE GYM BOOKING</div>
    <div class="registered-name" id="registeredNameDisplay" style="display:none;"></div>
    <h1>希望日を選んでください</h1>
    <p class="sub">複数の日をまとめて選べます</p>
  </header>

  <div class="calendar-section">
    <div class="month-nav">
      <button id="prevMonth" aria-label="前の月">‹</button>
      <div class="month-label" id="monthLabel">2026年8月</div>
      <button id="nextMonth" aria-label="次の月">›</button>
    </div>

    <div class="legend">
      <span><span class="dot full"></span>満員</span>
      <span><span class="dot closed"></span>休館</span>
      <span><span class="dot mint"></span>予約済み(タップでキャンセル)</span>
    </div>

    <div class="calendar-card">
      <div class="weekdays">
        <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
      </div>

      <div class="grid" id="grid"></div>
    </div>
  </div>

  <button class="edit-name-link" id="editNameBtn">登録した名前を変更する</button>

  <div class="selection-panel" id="selectionPanel" style="display:none;">
    <div class="label">選択中の日程</div>
    <div class="chip-row" id="chipRow"></div>
  </div>

  <div class="cta-bar">
    <div class="cta-count"><b id="selCount">0</b>件選択中</div>
    <button class="cta-btn" id="submitBtn" disabled>この日程で予約する</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="register-overlay" id="surveyOverlay">
    <div class="register-card" id="surveyCard" style="text-align:left; max-height: 80vh; overflow-y: auto; -webkit-overflow-scrolling: touch;">
      <div class="register-title" id="surveySubjectEl" style="text-align:center;"></div>
      <div class="register-hint" id="surveyContentEl" style="text-align:center;"></div>
      <div id="surveyQuestionsEl"></div>
      <button class="register-btn" id="surveySubmitBtn">回答する</button>
      <button class="edit-name-link" id="surveySkipBtn">今はしない</button>
    </div>
  </div>

  <div class="register-overlay" id="registerOverlay">
    <div class="register-card">
      <div class="register-title">生徒の氏名を教えてください</div>
      <div class="register-hint">予約・お月謝の管理に使用します。<br>フルネームでご入力ください。</div>
      <input type="text" id="registerNameInput" class="register-input" placeholder="例：山田太郎">
      <button class="register-btn" id="registerSaveBtn">登録する</button>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-mascot">
      <div class="dino-scene">
        <div class="tramp-shadow"></div>
        <div class="burst burst-l"></div>
        <div class="burst burst-c"></div>
        <div class="burst burst-r"></div>
        <div class="tramp-leg tramp-leg-l1"></div>
        <div class="tramp-leg tramp-leg-l2"></div>
        <div class="tramp-leg tramp-leg-r1"></div>
        <div class="tramp-leg tramp-leg-r2"></div>
        <div class="tramp-mat"></div>
        <img src="dino.png" class="dino-img" alt="">
      </div>
      <div class="loading-text" id="loadingText">じゅんびちゅう…</div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   ▼▼▼ ここだけ書き換えれば本番稼働します ▼▼▼
========================================================= */
const LIFF_ID = "2010959314-SoDIKt2f";
const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbwfdIXOL64z7DSMTvcXau6hFXMa5w6rYdwToZ8qg5BR9Aa9Is2w_Dp3X9eO3N7cBE1uXw/exec";
/* =========================================================
   ▲▲▲ ここまで ▲▲▲
========================================================= */

const WEEKDAY_JP = ["日","月","火","水","木","金","土"];

let liffProfile = null;       // { userId, displayName }
let availabilityMap = {};     // { "2026-08-10": { full: true/false } }
let bookedSet = new Set();    // あなたが予約済みの日付("2026-08-10"形式)の集合

async function initLiff(){
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()){
      liff.login();
      return;
    }
    // getProfile()は毎回LINEへ通信が発生し遅い。
    // ログイン時に受け取るIDトークンにuserId・表示名が既に入っているので、
    // それをそのまま使うことで通信を1回分減らす。
    const idToken = liff.getDecodedIDToken();
    if (idToken){
      liffProfile = { userId: idToken.sub, displayName: idToken.name || "お客様" };
    } else {
      // 念のためのフォールバック（通常はここに来ない）
      liffProfile = await liff.getProfile();
    }
  } catch (err){
    console.error("LIFF init failed", err);
    showToast("読み込みに失敗しました。時間をおいて再度お試しください");
  }
}

// タイムアウト付き・失敗時は自動で数回リトライするfetch
async function fetchWithRetry_(url, options, retries = 2, timeoutMs = 8000){
  for (let attempt = 0; attempt <= retries; attempt++){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { ...(options || {}), signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (err){
      clearTimeout(timer);
      if (attempt === retries) throw err;
      await new Promise(r => setTimeout(r, 700 * (attempt + 1))); // 少し待って再試行
    }
  }
}

async function fetchAvailability(){
  try {
    const data = await fetchWithRetry_(`${GAS_ENDPOINT}?action=availability`);
    availabilityMap = {};
    (data.dates || []).forEach(d => {
      availabilityMap[d.date] = { full: d.full, remain: d.remain, closed: d.closed, hours: d.hours };
    });
    try { localStorage.setItem("cachedAvailability", JSON.stringify(availabilityMap)); } catch (e) {}
  } catch (err){
    console.error("availability fetch failed", err);
    showToast("空き状況の取得に失敗しました");
  }
}

// "14:00〜22:00" のような文字列を、セル内で2行の小さい表示用に変換する
// 例: "1400-" / "2200"
function formatHoursCompact_(hours){
  if (!hours) return "";
  const parts = hours.split("〜");
  if (parts.length !== 2) return hours;
  const strip = s => s.replace(":", "").trim();
  return `${strip(parts[0])}-\n${strip(parts[1])}`;
}

async function fetchMyBookings(){
  if (!liffProfile) return;
  try {
    const data = await fetchWithRetry_(`${GAS_ENDPOINT}?action=myBookings&userId=${encodeURIComponent(liffProfile.userId)}`);
    bookedSet = new Set((data.bookings || []).map(b => b.date));
    try { localStorage.setItem("cachedBookedDates", JSON.stringify(Array.from(bookedSet))); } catch (e) {}

    // 登録状況もここで一緒に受け取る(別通信を省いて表示を早くするため)
    currentRegisteredName = data.name || "";
    updateRegisteredNameDisplay();
    if (data.registered) {
      // 既に登録済みだと分かったので、開いていたフォームを自動で閉じる
      document.getElementById("registerOverlay").classList.remove("show");
      try {
        localStorage.setItem("cachedRegistered", "true");
        localStorage.setItem("cachedRegisteredName", currentRegisteredName);
      } catch (e) {}
    }
    // 未登録の場合は、アプリ起動時から既に開いているフォームをそのまま使ってもらう
  } catch (err){
    console.error("myBookings fetch failed", err);
    showToast("予約情報の取得に失敗しました");
  }
}

function statusOf(key){
  const info = availabilityMap[key];
  if (!info) return { status: "unknown" };
  if (info.closed) return { status: "closed" };
  if (info.full) return { status: "full" };
  if (typeof info.remain === "number" && info.remain <= 2) return { status: "low" };
  return { status: "ok" };
}

function fmt(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

const TODAY = new Date();
TODAY.setHours(0,0,0,0);

let viewYear = TODAY.getFullYear();
let viewMonth = TODAY.getMonth(); // 0-indexed
const MIN_MONTH = TODAY.getFullYear() * 12 + TODAY.getMonth();
const MAX_MONTH_OFFSET = 1; // 常に向こう2ヶ月（今月含む）

const selectedDates = new Set();

const grid = document.getElementById("grid");
const monthLabel = document.getElementById("monthLabel");
const prevBtn = document.getElementById("prevMonth");
const nextBtn = document.getElementById("nextMonth");
const selCount = document.getElementById("selCount");
const submitBtn = document.getElementById("submitBtn");
const chipRow = document.getElementById("chipRow");
const selectionPanel = document.getElementById("selectionPanel");
const toastEl = document.getElementById("toast");

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1800);
}

const loadingOverlayEl = document.getElementById("loadingOverlay");
const loadingTextEl = document.getElementById("loadingText");
function showLoadingOverlay(text){
  loadingTextEl.textContent = text || "じゅんびちゅう…";
  loadingOverlayEl.classList.add("show");
}
function hideLoadingOverlay(){
  loadingOverlayEl.classList.remove("show");
  loadingTextEl.textContent = "じゅんびちゅう…";
}


function renderMonth(){
  const curMonthIdx = viewYear * 12 + viewMonth;
  prevBtn.disabled = curMonthIdx <= MIN_MONTH;
  nextBtn.disabled = curMonthIdx >= MIN_MONTH + MAX_MONTH_OFFSET;

  monthLabel.textContent = `${viewYear}年${viewMonth + 1}月`;

  grid.innerHTML = "";
  const firstDay = new Date(viewYear, viewMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

  for (let i = 0; i < startWeekday; i++){
    const empty = document.createElement("div");
    empty.className = "day-cell empty";
    grid.appendChild(empty);
  }

  for (let day = 1; day <= daysInMonth; day++){
    const d = new Date(viewYear, viewMonth, day);
    d.setHours(0,0,0,0);
    const key = fmt(d);
    const isPast = d < TODAY;
    const isBooked = bookedSet.has(key);
    const { status } = statusOf(key);

    const cell = document.createElement("div");
    cell.className = "day-cell";
    if (isPast) cell.classList.add("is-past");
    if (status === "closed") cell.classList.add("is-closed");

    const btn = document.createElement("button");
    btn.className = "day-btn";
    btn.dataset.key = key;
    if (isPast) btn.classList.add("past");
    else if (isBooked) btn.classList.add("booked");
    else if (status === "closed") btn.classList.add("closed");
    else if (status === "full") btn.classList.add("full");

    if (selectedDates.has(key)) btn.classList.add("selected");

    const ring = document.createElement("div");
    ring.className = "avail-ring";
    btn.appendChild(ring);

    const stamp = document.createElement("div");
    stamp.className = "stamp";
    stamp.innerHTML = stampSVG();
    btn.appendChild(stamp);

    const num = document.createElement("div");
    num.className = "day-num";
    num.textContent = day;
    btn.appendChild(num);

    if (!isPast && isBooked){
      btn.addEventListener("click", () => confirmCancel(key));
    } else if (!isPast && status !== "full" && status !== "closed"){
      btn.addEventListener("click", () => toggleDate(key, btn));
    }

    cell.appendChild(btn);

    // 丸マークの外側・下に完全に分離した営業時間表示
    const hoursEl = document.createElement("div");
    hoursEl.className = "day-hours";
    if (!isPast){
      const info = availabilityMap[key];
      if (status === "closed"){
        hoursEl.textContent = "休館";
      } else if (info && info.hours){
        hoursEl.textContent = formatHoursCompact_(info.hours);
      }
    }
    cell.appendChild(hoursEl);

    grid.appendChild(cell);
  }
}

function stampSVG(){
  return `<svg viewBox="0 0 100 100" width="100%" height="100%">
    <path d="M50 4 C70 4 90 10 92 32 C94 50 88 68 76 82 C64 94 40 96 24 86
             C8 76 2 54 8 34 C14 12 32 4 50 4 Z"
          fill="var(--orange)" />
  </svg>`;
}

function confirmCancel(key){
  const [y,m,dd] = key.split("-");
  const d = new Date(Number(y), Number(m)-1, Number(dd));
  const label = `${Number(m)}月${Number(dd)}日(${WEEKDAY_JP[d.getDay()]})`;

  const ok = window.confirm(`${label} の予約をキャンセルしますか？`);
  if (!ok) return;
  doCancel(key);
}

async function doCancel(key){
  if (!liffProfile) return;

  // 先に画面を更新（体感速度優先）。失敗したら後で元に戻す
  bookedSet.delete(key);
  try { localStorage.setItem("cachedBookedDates", JSON.stringify(Array.from(bookedSet))); } catch (e) {}
  renderMonth();
  showToast("キャンセルしました");

  try {
    const data = await fetchWithRetry_(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({
        action: "cancel",
        userId: liffProfile.userId,
        date: key,
      }),
    });
    if (data.success){
      fetchAvailability().then(renderMonth); // 空きが出るので裏側で更新(表示をブロックしない)
    } else {
      // 失敗していたので元に戻す
      bookedSet.add(key);
      try { localStorage.setItem("cachedBookedDates", JSON.stringify(Array.from(bookedSet))); } catch (e) {}
      renderMonth();
      showToast("キャンセルできませんでした。もう一度お試しください");
    }
  } catch (err){
    console.error("cancel failed", err);
    bookedSet.add(key);
    try { localStorage.setItem("cachedBookedDates", JSON.stringify(Array.from(bookedSet))); } catch (e) {}
    renderMonth();
    showToast("通信に失敗しました。時間をおいて再度お試しください");
  }
}

function toggleDate(key, btn){
  if (selectedDates.has(key)){
    selectedDates.delete(key);
    btn.classList.remove("selected");
  } else {
    selectedDates.add(key);
    btn.classList.add("selected");
  }
  renderSelection();
}

function renderSelection(){
  selCount.textContent = selectedDates.size;
  submitBtn.disabled = selectedDates.size === 0;

  if (selectedDates.size === 0){
    selectionPanel.style.display = "none";
    chipRow.innerHTML = "";
    return;
  }
  selectionPanel.style.display = "block";
  chipRow.innerHTML = "";

  const sorted = Array.from(selectedDates).sort();
  sorted.forEach(key => {
    const [y,m,dd] = key.split("-");
    const d = new Date(Number(y), Number(m)-1, Number(dd));
    const label = `${Number(m)}/${Number(dd)}(${WEEKDAY_JP[d.getDay()]})`;

    const chip = document.createElement("div");
    chip.className = "chip";
    chip.innerHTML = `<span>${label}</span>`;
    const rm = document.createElement("button");
    rm.textContent = "×";
    rm.addEventListener("click", () => {
      selectedDates.delete(key);
      renderMonth();
      renderSelection();
    });
    chip.appendChild(rm);
    chipRow.appendChild(chip);
  });
}

prevBtn.addEventListener("click", () => {
  viewMonth--;
  if (viewMonth < 0){ viewMonth = 11; viewYear--; }
  renderMonth();
});
nextBtn.addEventListener("click", () => {
  viewMonth++;
  if (viewMonth > 11){ viewMonth = 0; viewYear++; }
  renderMonth();
});

submitBtn.addEventListener("click", async () => {
  const dates = Array.from(selectedDates).sort();
  if (!dates.length) return;

  if (!liffProfile){
    showToast("読み込み中です。少し待ってから再度お試しください");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "送信中…";
  showLoadingOverlay("よやくちゅう…");

  try {
    const data = await fetchWithRetry_(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({
        action: "book",
        userId: liffProfile.userId,
        displayName: liffProfile.displayName,
        dates: dates,
      }),
    }, 2, 15000); // 予約処理は少し重いのでタイムアウトを長めに
    const results = data.results || [];
    const succeeded = results.filter(r => r.success).length;
    const failed = results.length - succeeded;

    results.filter(r => r.success).forEach(r => {
      bookedSet.add(r.date);
      selectedDates.delete(r.date);
    });
    await fetchAvailability(); // 予約人数が変わるので空き状況を再取得
    renderMonth();
    renderSelection();

    if (succeeded > 0 && failed === 0){
      showToast(`${succeeded}件の予約を受け付けました`);
    } else if (succeeded > 0 && failed > 0){
      showToast(`${succeeded}件受付・${failed}件は満員のため不可でした`);
    } else {
      showToast("選択いただいた日程は受け付けできませんでした");
    }
    // 自動では閉じない。予約済み(青いスタンプ)への変化を確認してから、
    // 本人が画面右上の×ボタンなどで閉じる。

  } catch (err){
    console.error("booking failed", err);
    showToast("送信に失敗しました。時間をおいて再度お試しください");
  } finally {
    submitBtn.disabled = selectedDates.size === 0;
    submitBtn.textContent = "この日程で予約する";
    hideLoadingOverlay();
  }
});

let currentRegisteredName = "";

function updateRegisteredNameDisplay(){
  const el = document.getElementById("registeredNameDisplay");
  if (currentRegisteredName){
    el.textContent = currentRegisteredName + "さん";
    el.style.display = "block";
  } else {
    el.style.display = "none";
  }
}

document.getElementById("editNameBtn").addEventListener("click", () => {
  document.getElementById("registerNameInput").value = currentRegisteredName;
  document.getElementById("registerOverlay").classList.add("show");
});

document.getElementById("registerSaveBtn").addEventListener("click", async () => {
  const input = document.getElementById("registerNameInput");
  const name = input.value.trim();
  if (!name){
    showToast("お名前を入力してください");
    return;
  }
  if (!liffProfile){
    showToast("読み込み中です。少し待ってから再度お試しください");
    return;
  }
  const btn = document.getElementById("registerSaveBtn");
  btn.disabled = true;
  btn.textContent = "登録中…";
  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({
        action: "registerName",
        userId: liffProfile.userId,
        displayName: liffProfile.displayName,
        name: name,
      }),
    });
    const result = await res.json();
    if (result.success){
      currentRegisteredName = name;
      updateRegisteredNameDisplay();
      document.getElementById("registerOverlay").classList.remove("show");
      try {
        localStorage.setItem("cachedRegistered", "true");
        localStorage.setItem("cachedRegisteredName", name);
      } catch (e) {}
      showToast("登録しました。よろしくお願いします！");
    } else {
      showToast("登録に失敗しました。もう一度お試しください");
    }
  } catch (err){
    console.error("registerName failed", err);
    showToast("通信に失敗しました");
  } finally {
    btn.disabled = false;
    btn.textContent = "登録する";
  }
});

/* ---------- アンケート ---------- */
let activeSurvey = null;
let surveyAnswers = {}; // questionIndex(文字列) -> 回答値

async function fetchActiveSurvey(){
  if (!liffProfile) return;
  try {
    const data = await fetchWithRetry_(`${GAS_ENDPOINT}?action=surveyActive&userId=${encodeURIComponent(liffProfile.userId)}`);
    activeSurvey = data.survey || null;
    if (!activeSurvey){
      document.getElementById("surveyBanner").style.display = "none";
      return;
    }
    document.getElementById("surveyBanner").style.display = "flex";
    document.getElementById("surveyBannerText").textContent = activeSurvey.subject + "の回答はこちら";

    const dismissedDate = localStorage.getItem("surveyDismissedDate_" + activeSurvey.id);
    const todayStr = fmt(new Date());
    if (dismissedDate !== todayStr){
      openSurveyPopup();
    }
  } catch (err){
    console.error("surveyActive fetch failed", err);
  }
}

function renderSurveyQuestions(){
  document.getElementById("surveySubjectEl").textContent = activeSurvey.subject;
  document.getElementById("surveyContentEl").textContent = activeSurvey.content || "";
  document.getElementById("surveyContentEl").style.display = activeSurvey.content ? "block" : "none";

  surveyAnswers = {};
  const wrap = document.getElementById("surveyQuestionsEl");
  wrap.innerHTML = "";

  activeSurvey.questions.forEach((q, qIndex) => {
    const qEl = document.createElement("div");
    qEl.className = "survey-question";
    const titleEl = document.createElement("div");
    titleEl.className = "sq-title";
    titleEl.textContent = q.question;
    qEl.appendChild(titleEl);

    const optionsEl = document.createElement("div");
    optionsEl.className = "survey-options" + (q.type === "number" ? " numbers" : "");

    let choices = [];
    if (q.type === "radio") choices = q.options || [];
    if (q.type === "number") {
      const min = Number(q.min || 1), max = Number(q.max || 5);
      for (let n = min; n <= max; n++) choices.push(String(n));
    }

    choices.forEach(choice => {
      const label = document.createElement("label");
      label.className = "survey-option-label";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "sq_" + qIndex;
      input.value = choice;
      input.addEventListener("change", () => {
        surveyAnswers[qIndex] = choice;
        optionsEl.querySelectorAll(".survey-option-label").forEach(l => l.classList.remove("checked"));
        label.classList.add("checked");
      });
      label.appendChild(input);
      const span = document.createElement("span");
      span.textContent = choice;
      label.appendChild(span);
      optionsEl.appendChild(label);
    });

    qEl.appendChild(optionsEl);
    wrap.appendChild(qEl);
  });
}

function openSurveyPopup(){
  if (!activeSurvey) return;
  renderSurveyQuestions();
  document.getElementById("surveyOverlay").classList.add("show");
}
function closeSurveyPopup(){
  document.getElementById("surveyOverlay").classList.remove("show");
}

document.getElementById("surveyBannerBtn").addEventListener("click", openSurveyPopup);

document.getElementById("surveySkipBtn").addEventListener("click", () => {
  if (activeSurvey) localStorage.setItem("surveyDismissedDate_" + activeSurvey.id, fmt(new Date()));
  closeSurveyPopup();
});

document.getElementById("surveySubmitBtn").addEventListener("click", async () => {
  if (!activeSurvey || !liffProfile) return;
  const totalQuestions = activeSurvey.questions.length;
  if (Object.keys(surveyAnswers).length < totalQuestions){
    showToast("すべての質問に回答してください");
    return;
  }
  const answers = activeSurvey.questions.map((q, qIndex) => ({ question: q.question, answer: surveyAnswers[qIndex] }));

  const btn = document.getElementById("surveySubmitBtn");
  btn.disabled = true;
  btn.textContent = "送信中…";
  try {
    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({
        action: "surveySubmit", userId: liffProfile.userId,
        displayName: currentRegisteredName || liffProfile.displayName,
        surveyId: activeSurvey.id, answers: answers,
      }),
    });
    const result = await res.json();
    if (result.success){
      showToast("回答ありがとうございました！");
      closeSurveyPopup();
      document.getElementById("surveyBanner").style.display = "none";
      activeSurvey = null;
    } else if (result.reason === "already_answered"){
      showToast("すでに回答済みです");
      closeSurveyPopup();
      document.getElementById("surveyBanner").style.display = "none";
    } else {
      showToast("送信に失敗しました。もう一度お試しください");
    }
  } catch (err){
    console.error("surveySubmit failed", err);
    showToast("通信に失敗しました");
  } finally {
    btn.disabled = false;
    btn.textContent = "回答する";
  }
});

// バナーはスクロールで下に隠れ、上端付近や上スクロールで再度出てくる
(function setupSurveyBannerScroll_(){
  let lastY = 0;
  window.addEventListener("scroll", () => {
    const banner = document.getElementById("surveyBanner");
    if (banner.style.display === "none") return;
    const y = window.scrollY;
    if (y > lastY && y > 40){
      banner.classList.add("hide-on-scroll");
    } else {
      banner.classList.remove("hide-on-scroll");
    }
    lastY = y;
  }, { passive: true });
})();

(async function start(){
  // 前回登録済みだったことが端末に記録されていれば、フォームは出さない
  // 記録が無い場合(初めて・未登録の可能性)だけ、念のため先にフォームを開いておく
  let cachedRegistered = false;
  try {
    cachedRegistered = localStorage.getItem("cachedRegistered") === "true";
    const cachedName = localStorage.getItem("cachedRegisteredName");
    if (cachedRegistered && cachedName) {
      currentRegisteredName = cachedName;
      updateRegisteredNameDisplay();
    }
  } catch (e) {}
  if (!cachedRegistered) {
    document.getElementById("registerOverlay").classList.add("show");
  }

  // 前回開いた時のデータがあれば、まずそれを即座に表示（体感速度優先）
  try {
    const cachedBooked = localStorage.getItem("cachedBookedDates");
    if (cachedBooked) bookedSet = new Set(JSON.parse(cachedBooked));
  } catch (e) {}
  try {
    const cachedAvail = localStorage.getItem("cachedAvailability");
    if (cachedAvail) availabilityMap = JSON.parse(cachedAvail);
  } catch (e) {}

  // カレンダーの枠だけ先にすぐ表示（データが届く前でも骨組みは見せる）
  renderMonth();
  renderSelection();

  // 最新データが揃うまで、半透明のオーバーレイで「更新中」を示す
  showLoadingOverlay();

  // LINEログインと空き状況取得を同時に開始（片方を待たない）
  const availabilityPromise = fetchAvailability();
  const liffPromise = initLiff();

  // 空き状況が届き次第、確定していなくても先に反映
  await availabilityPromise;
  renderMonth();

  // LINEログインが終わったら、自分の予約情報を重ねて反映（キャッシュを最新情報で上書き）
  // 名前登録の確認は、この予約情報取得のレスポンスに相乗りさせて別通信を無くしている
  await liffPromise;
  await fetchMyBookings();
  renderMonth();
  renderSelection();
  fetchActiveSurvey(); // 予約カレンダーの表示をブロックしないよう、待たずに裏で走らせる

  hideLoadingOverlay();
})();
</script>
