<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>カードのご登録 | 指宿トランポリンジム</title>
<script src="https://web.squarecdn.com/v1/square.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFFBF3;
    --ink: #2B2320;
    --ink-soft: #7A6F63;
    --orange: #FF6F3C;
    --mint: #2FBF8F;
    --danger: #E0503A;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); font-family: "Zen Kaku Gothic New", sans-serif; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 32px 20px 40px; }
  .eyebrow { font-size: 12px; color: var(--mint); font-weight: 700; letter-spacing: 0.06em; text-align: center; }
  h1 { font-family: "Zen Maru Gothic", sans-serif; font-weight: 900; font-size: 21px; margin: 8px 0 4px; text-align: center; }
  .sub { font-size: 13px; color: var(--ink-soft); text-align: center; margin: 0 0 20px; }

  .amount-box {
    background: var(--white);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    margin-bottom: 16px;
    box-shadow: 0 3px 14px rgba(43,35,32,0.08);
  }
  .amount-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .amount-value { font-size: 24px; font-weight: 900; }

  .card-box {
    background: var(--white);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 3px 14px rgba(43,35,32,0.08);
  }
  #card-container { margin-bottom: 16px; }

  .consent-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .consent-row input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; }

  .submit-btn {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-family: "Zen Maru Gothic", sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--white);
    background: linear-gradient(135deg, var(--orange), #FF9466);
  }
  .submit-btn:disabled { opacity: 0.5; }

  .status-msg { min-height: 20px; margin-top: 10px; font-size: 12.5px; text-align: center; }
  .status-msg.error { color: var(--danger); font-weight: 700; }

  .hint { font-size: 11.5px; color: var(--ink-soft); line-height: 1.6; text-align: center; margin-top: 16px; }

  .done-box { display: none; max-width: 420px; margin: 80px auto 0; padding: 0 20px; text-align: center; }
  .done-box .icon { font-size: 44px; margin-bottom: 10px; }
  .done-box h1 { margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">TRAMPOLINE GYM BOOKING</div>
    <h1 id="pageTitle">お支払い方法のご登録</h1>
    <p class="sub" id="pageSub">安全な決済サービス「Square」を使用しています</p>

    <div class="amount-box" id="amountBox" style="display:none;">
      <div class="amount-label" id="amountLabel"></div>
      <div class="amount-value" id="amountValue"></div>
    </div>

    <div class="card-box" id="formBox">
      <div id="card-container"></div>

      <label class="consent-row">
        <input type="checkbox" id="consentCheckbox">
        <span>カード情報を保存し、次回以降も自動でお引き落としさせていただくことに同意します</span>
      </label>

      <button class="submit-btn" id="submitBtn" disabled>読み込み中…</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <p class="hint">
      入力されたカード番号は、この画面から直接Square社のサーバーへ安全に送信されます。<br>
      当ジムがカード番号を直接保存・保持することはありません。
    </p>
  </div>

  <div class="done-box" id="doneBox">
    <div class="icon">✅</div>
    <h1>登録が完了しました</h1>
    <p class="sub">このままLINEアプリに戻っていただいて大丈夫です</p>
  </div>

<script>
/* =========================================================
   選手用・一般用の両方から、このページ1つを共通で使う。
   URLの ?system=general / ?system=athlete でどちらのGASに
   送るかを切り替える(未指定の場合は選手用として扱う＝後方互換)
========================================================= */
const ENDPOINTS = {
  athlete: "https://script.google.com/macros/s/AKfycbwfdIXOL64z7DSMTvcXau6hFXMa5w6rYdwToZ8qg5BR9Aa9Is2w_Dp3X9eO3N7cBE1uXw/exec",
  general: "https://script.google.com/macros/s/AKfycbzwp_poHH7SLbSah842xfB0va4oLIDxfTuQ0aO6hbGYddvo7UHrV3aLVl8nlrjOhA33/exec",
};
// Square のApplication ID / Location IDは選手用・一般用で同じSquareアカウントを使っているため共通でOK
const SQUARE_APP_ID = "sq0idp-gZNfM5-eqELTtB1PnFKi_Q";
const SQUARE_LOCATION_ID = "LD9GHQ49VQTB2";

const params = new URLSearchParams(window.location.search);
const system = params.get("system") === "general" ? "general" : "athlete";
const GAS_ENDPOINT = ENDPOINTS[system];

const userId = params.get("userId");
const amount = params.get("amount");
const chargeTitle = params.get("title");

const submitBtn = document.getElementById("submitBtn");
const statusMsg = document.getElementById("statusMsg");
const formBox = document.getElementById("formBox");
const doneBox = document.getElementById("doneBox");
const consentCheckbox = document.getElementById("consentCheckbox");

let card;
const submitBtnLabel = amount ? "このカードでお支払いを行う" : "このカードを登録する";

// 金額が渡されていれば、金額を大きく表示する
if (amount) {
  document.getElementById("pageTitle").textContent = "お支払い";
  document.getElementById("pageSub").textContent = "カードを登録し、そのままお支払いを行います";
  document.getElementById("amountBox").style.display = "block";
  document.getElementById("amountLabel").textContent = chargeTitle || "お支払い金額";
  document.getElementById("amountValue").textContent = Number(amount).toLocaleString() + "円";
}

function showStatus(text, type){
  statusMsg.textContent = text;
  statusMsg.className = "status-msg" + (type ? " " + type : "");
}

function updateSubmitEnabled(){
  submitBtn.disabled = !(card && consentCheckbox.checked);
}
consentCheckbox.addEventListener("change", updateSubmitEnabled);

async function initializeCard(){
  if (!userId){
    showStatus("リンクが正しくありません。お手数ですが、もう一度LINEからリンクを開き直してください。", "error");
    return;
  }
  try {
    const payments = Square.payments(SQUARE_APP_ID, SQUARE_LOCATION_ID);
    card = await payments.card();
    await card.attach("#card-container");
    submitBtn.textContent = submitBtnLabel;
    updateSubmitEnabled();
  } catch (err){
    console.error(err);
    showStatus("カード入力欄の読み込みに失敗しました。時間をおいて再度お試しください。", "error");
  }
}

submitBtn.addEventListener("click", async () => {
  if (!consentCheckbox.checked){
    showStatus("同意のチェックをお願いします", "error");
    return;
  }
  submitBtn.disabled = true;
  submitBtn.textContent = "処理中…";
  showStatus("");

  try {
    const result = await card.tokenize();
    if (result.status !== "OK"){
      throw new Error((result.errors && result.errors[0] && result.errors[0].message) || "カード情報の確認に失敗しました");
    }

    const res = await fetch(GAS_ENDPOINT, {
      method: "POST",
      body: JSON.stringify({
        action: "saveCardToken",
        userId: userId,
        token: result.token,
      }),
    });
    const data = await res.json();

    if (data.success){
      formBox.style.display = "none";
      document.querySelector(".hint").style.display = "none";
      document.getElementById("amountBox").style.display = "none";
      doneBox.style.display = "block";
    } else {
      throw new Error(data.reason || "登録に失敗しました");
    }
  } catch (err){
    console.error(err);
    showStatus("登録に失敗しました: " + err.message, "error");
    submitBtn.disabled = false;
    submitBtn.textContent = submitBtnLabel;
  }
});

initializeCard();
</script>
</body>
</html>
